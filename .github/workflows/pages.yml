# Publica o jogo (somente index.html) no GitHub Pages a cada push na main
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar arquivos do site
        run: |
          sh build-site.sh
          mkdir _site
          cp index.html _site/index.html
          cp -r icons manifest.webmanifest _site/ 2>/dev/null || true
          cp -r beta _site/beta
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true  # se o Pages estiver configurado por branch, esta etapa é dispensável
