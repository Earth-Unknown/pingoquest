<title>Pingo Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: trilha vertical em zigue-zague, estilo app de lições; mascote Pingo (um roteador) */
:root{
  /* Paleta oficial do guia visual do Pingo Quest. Padrão: modo claro (branco). Modo escuro: roxo neon. */
  --roxo:#7b3ff2; --roxo-fundo:#2a0a66; --lilas:#c88bff; --ciano-neon:#18ddfb; --rosa:#ff4fae; --amarelo:#ffd83d; --laranja:#ff9a1f; --verde:#7dff2b; --branco:#fff;
  --bg:#ffffff; --surface:#ffffff; --ink:#1f1642; --muted:#6c6492;
  --line:#e6e1f6; --line-deep:#d4cdee;
  --primary:#7b3ff2; --primary-deep:#5a22c4; --on-primary:#ffffff;
  --ok:#3fc83f; --ok-deep:#2a9a2a; --ok-bg:#e4f9d8; --ok-ink:#27730f;
  --bad:#ff4d6d; --bad-deep:#cf2f4e; --bad-bg:#ffe4ea; --bad-ink:#b0213f;
  --gold:#ffd83d; --gold-deep:#d9a400; --cyan:#0fa8d4;
  --locked:#ebe8f6; --locked-deep:#d6d0ea;
  --face:#1b1240;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#150638; --surface:#211052; --ink:#ffffff; --muted:#b9a9e4;
  --line:#3d2a8f; --line-deep:#31207a;
  --ok:#7dff2b; --ok-deep:#4fb80e; --ok-bg:#24511c; --ok-ink:#c4ff9a;
  --bad:#ff5a7a; --bad-deep:#cf3050; --bad-bg:#561344; --bad-ink:#ffc0d0;
  --cyan:#18ddfb;
  --locked:#41208f; --locked-deep:#2e1470;
  --face:#12052e;
  color-scheme:dark;
}

*{box-sizing:border-box}
:root[data-theme="dark"] body{background-image:linear-gradient(180deg,#1b0944,#12053a);background-attachment:fixed}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
svg{display:block}

/* barra de status */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding-inline:max(16px,env(safe-area-inset-left,0px));
  border-bottom:2px solid var(--line)}
#top .wrap{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;gap:8px}
.stat{display:flex;align-items:center;gap:7px;font-weight:900;font-size:18px}
.stat svg{width:24px;height:24px}
.s-streak{color:#ff8a1f;background:none;border:0;padding:4px 6px;margin:-4px -6px;border-radius:12px;font:inherit;cursor:pointer}.s-gems{color:var(--cyan)}.s-heart{color:var(--bad)}

/* botões 3D */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:900;font-size:16px;
  letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--roxo-fundo);box-shadow:0 5px 0 var(--gold-deep);
  transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--gold-deep)}
.btn:disabled{background:var(--locked);color:var(--muted);box-shadow:0 5px 0 var(--locked-deep);cursor:not-allowed}
.btn.blue{background:var(--cyan);box-shadow:0 5px 0 #0e87b3;color:#04202c}
.btn.blue:active:not(:disabled){box-shadow:0 0 0 #0e87b3}
.btn.ghost{background:var(--surface);color:var(--cyan);border:2px solid var(--line-deep);box-shadow:0 4px 0 var(--line-deep);padding:13px 18px}
.btn.ghost:active{box-shadow:0 0 0 var(--line-deep);transform:translateY(4px)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 var(--bad-deep)}
.btn.bad:active{box-shadow:0 0 0 var(--bad-deep)}
.btn.prim{background:var(--primary);color:var(--on-primary);box-shadow:0 5px 0 var(--primary-deep)}
.btn.prim:active{box-shadow:0 0 0 var(--primary-deep)}

/* trilha */
.unit{margin-top:18px}
.nextsec{margin:34px -16px 0;padding:26px 20px 30px;text-align:center;background:var(--locked);border-top:2px solid var(--line-deep);color:var(--muted)}
.nschip{display:inline-block;background:var(--surface);color:var(--muted);font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:12px;border:2px solid var(--line-deep)}
.nextsec h2{margin:14px 0 6px;font-size:28px;font-weight:900;color:var(--ink);opacity:.55;display:flex;align-items:center;justify-content:center;gap:8px}
.nextsec h2 svg{width:26px;height:26px}
.nextsec .nspingo{opacity:.5;filter:grayscale(.6);display:flex;justify-content:center}.nextsec .nspingo svg{width:88px;height:88px}
.nextsec p{margin:6px auto 16px;font-weight:700;max-width:30ch;text-wrap:balance}
.nextsec .btn:disabled{opacity:.7}
.uhead{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:18px;padding:14px 16px;color:#fff;
  background:var(--uh);box-shadow:0 5px 0 var(--ud)}
.uhead .tag{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.uhead h2{margin:2px 0 0;font-size:21px;line-height:1.15;font-weight:900;text-wrap:balance}
.tipbtn{flex:none;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;border-radius:12px;
  padding:7px 13px;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.u0{--uh:#0fa8d4;--ud:#0a7a9c}.u1{--uh:#f27d0c;--ud:#b85a00}.u2{--uh:#f0409f;--ud:#b32477}.u3{--uh:#22a83a;--ud:#167a28}.u4{--uh:#7b3ff2;--ud:#5420bd}
.uhead{background:linear-gradient(135deg,var(--uh),color-mix(in srgb,var(--uh) 70%,#fff 30%))}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 8px}
.nw{position:relative;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.node svg{width:34px;height:34px}
.node.done{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep);color:#fff}
.node.cur{background:var(--uh,var(--primary));box-shadow:0 6px 0 var(--ud,var(--primary-deep)),0 0 22px color-mix(in srgb,var(--uh,#7b3ff2) 70%,transparent);color:#fff}
.node.lock{background:color-mix(in srgb,var(--uh,#7b3ff2) 18%,var(--locked));box-shadow:0 6px 0 var(--locked-deep);color:var(--muted);cursor:not-allowed}
.node:active:not(.lock){transform:translateY(6px);box-shadow:0 0 0 transparent}
.nlabel{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.bubble{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line-deep);
  color:var(--cyan);font-weight:900;font-size:13px;letter-spacing:.07em;padding:6px 12px;border-radius:12px;white-space:nowrap;
  animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);
  border-right:2px solid var(--line-deep);border-bottom:2px solid var(--line-deep);transform:translateX(-50%) rotate(45deg)}
.pingo{position:absolute;top:2px;width:64px}
.pingo.l{right:calc(100% + 14px)}.pingo.r{left:calc(100% + 14px)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}

/* navegação */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:transparent;border:0;pointer-events:none;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  --nc1:#cdbbf5;--nc2:#c6b2f3;--nc2s:#c6b2f3;--nc3:#ece3fc;--nc4:#d9c9f6;--ns:#8f72dc}
#nav .wrap{pointer-events:auto;display:flex;gap:2px;justify-content:center;max-width:560px;margin:0 auto;padding:4px;border-radius:26px;
  background:#fff;border:1.5px solid #e6dcfb;box-shadow:0 6px 18px rgba(123,63,242,.16)}
.nbtn{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:2px solid transparent;
  border-radius:20px;padding:5px 0 4px;font-weight:800;font-size:10.5px;letter-spacing:0;text-transform:none;color:#7a6cb0;min-height:50px}
.nbtn svg{width:25px;height:25px;transition:transform .15s}
.nbtn[aria-current="page"] svg{transform:none}
:root[data-theme="dark"] #nav{--nc1:#fbf1e6;--nc2:#f1e8ff;--nc2s:#f1e8ff;--nc3:#fff8ff;--nc4:#efe4ff;--ns:none}
:root[data-theme="dark"] #nav .wrap{border:0;background:linear-gradient(180deg,#5a24c8,#3d1590);box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
:root[data-theme="dark"] .nbtn{color:#fff}
.nbtn[data-t=path]{--ic:#18ddfb}.nbtn[data-t=missions]{--ic:#ff4fae}.nbtn[data-t=review]{--ic:#7dff2b}.nbtn[data-t=conq]{--ic:#ffd83d}.nbtn[data-t=profile]{--ic:#c88bff}
.nbtn[aria-current="page"]{border-color:transparent;background:#f1eaff;color:#5a2ec4;box-shadow:none}
:root[data-theme="dark"] .nbtn[aria-current="page"]{border-color:transparent;background:rgba(200,139,255,.22);color:#fff;box-shadow:none}

/* perfil */
.ph{display:flex;align-items:center;gap:16px;padding:22px 0 8px}
.ph .pingo-big{width:104px;flex:none}
.ph h1{margin:0;font-size:28px;font-weight:900}
.ph p{margin:4px 0 0;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.tile{--tc:var(--cyan);background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 30%,var(--surface)),var(--surface) 75%);border:2px solid color-mix(in srgb,var(--tc) 70%,transparent);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.tile svg{width:30px;height:30px;flex:none}
.grid .tile:nth-child(1){--tc:#ffd83d}.grid .tile:nth-child(2){--tc:#ff9a1f}.grid .tile:nth-child(3){--tc:#18ddfb}.grid .tile:nth-child(4){--tc:#ff4fae}.grid .tile:nth-child(5){--tc:#7dff2b}.grid .tile:nth-child(6){--tc:#c88bff}
.tile b{display:block;font-size:24px;line-height:1.1;font-weight:900}
.tile span{font-size:13px;color:var(--muted);font-weight:700}
.sect{font-size:20px;font-weight:900;margin:22px 0 10px}
.skcard{position:relative;width:100%;height:78px;border-radius:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18);overflow:hidden}
.skcard svg{height:56px;width:56px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.skcard.off{filter:grayscale(.85) brightness(.9);opacity:.8}
.skst{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;font-weight:900;font-size:15px;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.skgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.sktile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.sktile.off .skico{opacity:.55;filter:saturate(.7)}.sktile.off{border-style:dashed}
.skico{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.skico svg{width:42px;height:42px}
.sktile b{font-size:14px;font-weight:900;line-height:1.2}.sktile small{font-size:12px;font-weight:800;color:var(--muted)}
.cqgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.cqtile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.cqico{width:52px;height:52px;border-radius:15px;background:#b9c0cc;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.cqtile:not(.on) .cqico{opacity:.55;filter:saturate(.7)}.cqtile:not(.on){border-style:dashed}.cqtile.on{box-shadow:0 0 16px rgba(255,216,61,.35);border-color:var(--amarelo)}
.cqico svg{width:34px;height:34px}
.cqtile b{font-size:12.5px;font-weight:900;line-height:1.15}.cqtile small{font-size:11px;font-weight:700;color:var(--muted);line-height:1.2}
.prog{background:var(--surface);border:2px solid var(--line-deep);border-radius:16px;padding:14px;margin-bottom:10px}
.prog .row{display:flex;justify-content:space-between;gap:10px;font-weight:800;margin-bottom:8px}
.bar{height:14px;border-radius:99px;background:var(--locked);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--verde),var(--ciano-neon));min-width:0;transition:width .4s}
.note{color:var(--muted);font-weight:700;font-size:14px}

/* lição */
#lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.lw{width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.lhead{display:flex;align-items:center;gap:14px;padding:14px 0}
.xbtn{border:0;background:transparent;color:var(--muted);padding:4px;border-radius:10px}
.xbtn svg{width:28px;height:28px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--locked);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.lbody{flex:1;overflow:auto;padding:10px 0 18px;min-height:0}
.eyebrow{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.q{font-size:25px;font-weight:900;line-height:1.2;margin:8px 0 20px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line-deep);border-radius:16px;padding:15px 16px;font-weight:700;font-size:17px;
  box-shadow:0 4px 0 var(--line-deep);transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--line-deep)}
.opt.sel{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,var(--surface));box-shadow:0 4px 0 var(--cyan)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default}
.vf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vf .opt{text-align:center;padding:22px 10px;font-size:20px;font-weight:900}
.vf svg{width:44px;height:44px;margin:0 auto 6px}
.zone{min-height:92px;border:2px solid var(--line-deep);background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:18px}
.zone .ph0{color:var(--muted);font-family:var(--mono);font-weight:600;padding:8px 4px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:var(--surface);border:2px solid var(--line-deep);border-radius:12px;padding:9px 13px;font-family:var(--mono);font-weight:700;font-size:15px;
  box-shadow:0 3px 0 var(--line-deep);color:var(--ink)}
.chip:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.chip.used{visibility:hidden}
.chip.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 3px 0 var(--ok)}
.chip.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad)}
.lfoot{padding:10px 0 16px}
.fb{border-radius:18px;padding:14px 16px;margin-bottom:14px}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink)}.fb.bad{background:var(--bad-bg);color:var(--bad-ink)}
.fb h3{margin:0 0 4px;font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}
.fb h3 svg{width:26px;height:26px}
.fb p{margin:4px 0 0;font-weight:700;font-size:15px}
.fb .ans{font-family:var(--mono);font-weight:700}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:10px 0}
.center h1{margin:6px 0 0;font-size:34px;font-weight:900}
.center p{margin:0;color:var(--muted);font-weight:700;max-width:34ch;text-wrap:balance}
.center .pingo-big{width:170px}
.res2{display:flex;gap:10px;margin:18px 0 6px;width:100%;justify-content:center}
.rt{flex:1;max-width:120px;border-radius:18px;background:var(--rc);padding:4px;opacity:0;transform:scale(.3);animation:rtpop .8s cubic-bezier(.2,1.8,.4,1) forwards}
.rt small{display:block;padding:5px 2px 6px;font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.rt span{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border-radius:14px;padding:14px 4px}
.rt span svg{width:22px;height:22px;flex:none;color:var(--rc)}.rt span b{font-size:22px;font-weight:900;color:var(--rc)}
@keyframes rtpop{0%{opacity:0;transform:translateY(170px) scale(.35)}55%{opacity:1;transform:translateY(-12px) scale(1.08)}78%{transform:translateY(3px) scale(.97)}100%{opacity:1;transform:none}}
.rt b.bump{animation:numbump .4s cubic-bezier(.3,1.8,.5,1)}

.nickbtn{margin-top:6px;border:2px solid var(--line);background:var(--surface);color:var(--primary-deep);font:inherit;font-weight:800;font-size:13px;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}

.duelc .duelh{display:flex;gap:12px;align-items:center}.duelc small{color:var(--muted);font-weight:700}
.duelic{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--amarelo) 40%,var(--surface));display:grid;place-items:center;flex:none}.duelic svg{width:26px;height:26px}
.duel{position:fixed;inset:0;z-index:6;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.dutop{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;font-size:18px}.dutop span{width:44px}
.dux{width:44px;height:44px;border:0;background:transparent;font-size:32px;line-height:1;color:var(--muted);cursor:pointer}
.dubody{flex:1;overflow:auto;padding:6px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%;margin:0 auto}
.dsec{font-weight:900;font-size:17px;margin:16px 0 8px}
.dchips{display:flex;gap:8px}.dchip{flex:1;border:2px solid var(--line);background:var(--surface);color:inherit;border-radius:16px;padding:10px;font:inherit;text-align:left;cursor:pointer;min-height:56px}
.dchip b{display:block}.dchip small{color:var(--muted);font-weight:700;font-size:12px}
.dchip.on,.dth.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface))}.dchip.lock{opacity:.5}
.dthemes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dth{border:2px solid var(--line);background:var(--surface);color:inherit;border-radius:16px;padding:10px;font:inherit;text-align:left;cursor:pointer;min-height:56px}
.dth b{display:block;font-size:14px}.dth small{color:var(--muted);font-weight:700;font-size:12px}.dth.rol{grid-column:1/-1;background:linear-gradient(135deg,color-mix(in srgb,var(--amarelo) 35%,var(--surface)),var(--surface))}
.dspin{text-align:center;padding-top:30px}.dspw{font-size:26px;font-weight:900;margin:14px 0;min-height:70px;display:grid;place-items:center}.dspw.hit{color:var(--primary);animation:rtpop .4s}

.sbub{position:absolute;z-index:3;top:-22px;left:calc(50% + var(--x));transform:translateX(-50%);background:var(--surface);color:var(--primary);border:2px solid var(--line-deep);border-radius:12px;padding:3px 10px;font-weight:900;font-size:12px;box-shadow:0 3px 0 var(--line-deep)}

/* ---------- conteúdo do curso ----------

   O build embute esse arquivo na página; o jogo converte o formato legível (em português) para o formato interno. */
function lerCurso(c){
  var erros=[],GAMES=[],CUR={},EXTRA={},EVQ=[];
  function bad(onde,msg){erros.push(onde+': '+msg)}
  function txt(x){return typeof x==='string'&&x.trim()!==''}
  function conv(it,onde,opt){
    opt=opt||{};var t=it&&it.tipo,q={};
    if(t==='aprender'){
      if(!txt(it.titulo)||!txt(it.texto)){bad(onde,'aprender precisa de titulo e texto');return null}
      return{t:'learn',title:it.titulo,text:it.texto,touch:(it.termos||[]).map(function(x){return[x.termo,x.definicao]})};
    }
    if(!txt(it&&it.pergunta)){bad(onde,'falta a pergunta');return null}
    q.q=it.pergunta;q.e=it.explicacao||'';
    if(t==='escolha'){
      if(!txt(it.certa)||!Array.isArray(it.erradas)||it.erradas.length<1){bad(onde,'"'+it.pergunta+'" precisa de certa e de pelo menos 1 errada');return null}
      q.t='mc';q.o=[it.certa].concat(it.erradas);q.a=0;
    }else if(t==='verdadeiro_falso'){
      if(typeof it.resposta!=='boolean'){bad(onde,'"'+it.pergunta+'" precisa de resposta true ou false');return null}
      q.t='vf';q.a=it.resposta;
    }else if(t==='ligar'){
      if(!Array.isArray(it.pares)||it.pares.length<2){bad(onde,'"'+it.pergunta+'" precisa de pelo menos 2 pares');return null}
      q.t='mp';q.pairs=it.pares.map(function(p){return[p.esquerda,p.direita]});
    }else if(t==='classificar'){
      var cats=it.categorias;
      if(!Array.isArray(cats)||cats.length<2||!Array.isArray(it.itens)){bad(onde,'"'+it.pergunta+'" precisa de categorias e itens');return null}
      var ok=true,its=it.itens.map(function(x){var i=cats.indexOf(x.categoria);if(i<0)ok=false;return[x.texto,i]});
      if(!ok){bad(onde,'"'+it.pergunta+'": categoria de um item não está na lista de categorias');return null}
      q.t='cl';q.cats=cats;q.items=its;
    }else{bad(onde,'tipo desconhecido "'+t+'"');return null}
    if(it.conceito)q.cid=it.conceito;
    q.dif=opt.dif||it.dificuldade||1;
    q.rs=it.revisao||'aprovado';
    return q;
  }
  var mundo=(c.mundos||[])[0]||{numero:1,nome:'',subtitulo:'',paradas:[]},places=[];
  (c.mundos||[]).forEach(function(m){(m.paradas||[]).forEach(function(p,pi){
    var gi=GAMES.length,onde='Parada '+(gi+1)+' ('+(p.lugar||p.titulo)+')';
    var g={title:p.titulo,tag:'Mundo '+(m.numero||1)+' · Parada '+(gi+1),c:0,names:[],tips:p.dicas||[],phases:[]};
    if(p.chamado)g.caso=p.chamado;
    places.push(p.lugar||p.titulo);
    (p.fases||[]).forEach(function(f,fi){
      var key=gi+'-'+fi,con=[],ph=[];g.names.push(f.nome||('Fase '+(fi+1)));
      (f.conceitos||[]).forEach(function(k){CUR[k.id]={n:k.nome,pre:k.antes||[],l:key};con.push(k.id)});
      (f.itens||[]).forEach(function(it,ii){
        var q=conv(it,onde+', '+g.names[fi]+', item '+(ii+1));if(!q)return;
        if(q.t==='learn')q.teach=con;else{q.cid=q.cid||con[0];q.lk=key}
        ph.push(q);
      });
      g.phases.push(ph);
    });

    var ex=[];(p.extras||[]).forEach(function(it,ii){var q=conv(it,onde+', extra '+(ii+1),{dif:3});if(q){q.rs='aprovado';q.lk='x'+gi;q.x=1;ex.push(q)}});

var PACT={clap:1000,wave:1900,jump:1500};
function pingoAct(sv,name){
  if(!sv||!sv.isConnected)return;
  ['clap','wave','jump'].forEach(function(a){sv.classList.remove('act-'+a)});
  void sv.getBoundingClientRect();sv.classList.add('act-'+name);
  setTimeout(function(){sv.classList.remove('act-'+name)},PACT[name]+40);
}
function pingoShow(sv){
  var order=['clap','wave','jump'],i=Math.floor(Math.random()*3),n=0;
  (function step(){
    if(!sv.isConnected||n>=4)return;
    var a=order[i++%3];n++;pingoAct(sv,a);setTimeout(step,PACT[a]+700);
  })();
}
(function(){

      var sv=nd.matches&&nd.matches('svg[data-m="cheer"]')?nd:nd.querySelector&&nd.querySelector('svg[data-m="cheer"]');

/* ===== Fase 1: estrutura de conhecimento =====
   CUR: conceitos {n:nome, pre:[pré-requisitos], l:"jogo-fase" onde o conceito é apresentado}
   Cada pergunta recebe: cid (conceito), dif (1-3), rs (status de revisão), lk (fase de origem).
   S.know[cid] = {seen, ok, bad, last}: o que o aluno viu e como foi. */
var PHCON={};Object.keys(CUR).forEach(function(id){var l=CUR[id].l;(PHCON[l]=PHCON[l]||[]).push(id)});
function knowOf(c){if(!S.know)S.know={};return S.know[c]||(S.know[c]={ok:0,bad:0,seen:0,last:''})}
function isSeen(c){return !!(S.know&&S.know[c]&&S.know[c].seen)}
function markSeen(cs){var ch=false;(cs||[]).forEach(function(c){var k=knowOf(c);if(!k.seen){k.seen=1;k.at=today();ch=true}});if(ch)save()}
function eligible(c){var d=CUR[c];return !!d&&isSeen(c)&&d.pre.every(isSeen)}
function eligibleQs(opt){opt=opt||{};return allQs().filter(function(q){return q.rs!=='rascunho'&&eligible(q.cid)&&(!opt.maxDif||q.dif<=opt.maxDif)&&(!opt.cid||q.cid===opt.cid)})}
function masteryOf(c){var k=S.know&&S.know[c];if(!k||!k.seen)return'novo';var n=k.ok+k.bad;if(n<3)return'aprendendo';var a=k.ok/n;if(a>=.85&&k.ok>=6)return'dominado';return a<.65?'fragil':'aprendendo'}
function backfillKnow(){GAMES.forEach(function(g,gi){g.phases.forEach(function(ph,pi){if(S.done[gi+'-'+pi])markSeen(PHCON[gi+'-'+pi])})})}
backfillKnow();
var SQ={g:-1,n:0};
function sqHit(ok){
  if(!L||L.kind!=='phase')return;
  var g=parseInt(L.key,10);if(SQ.g!==g)SQ={g:g,n:0};
  if(ok)SQ.n++;else SQ.n=0;
}
function xchReady(){return !!L&&L.kind==='phase'&&SQ.g===parseInt(L.key,10)&&SQ.n>=5}
function pickExtras(g){
  var base=(EXTRA[g]||[]),ph=(GAMES[g]&&GAMES[g].phases)||[],seen=S.xseen||(S.xseen=[]);
  var more=[];ph.forEach(function(p){p.forEach(function(q){if((q.t==='mc'||q.t==='vf')&&q.o!==undefined||q.t==='vf')more.push(q)})});
  var pool=base.concat(more).filter(function(q){return q.t!=='learn'&&eligible(q.cid)});
  var fresh=pool.filter(function(q){return seen.indexOf(q.q)<0});
  if(fresh.length<3){seen.length=0;fresh=pool}
  var out=[],cids={};
  shuffle(fresh).forEach(function(q){if(out.length<3&&!cids[q.cid]){out.push(q);cids[q.cid]=1}});
  shuffle(fresh).forEach(function(q){if(out.length<3&&out.indexOf(q)<0)out.push(q)});
  out.forEach(function(q){if(seen.indexOf(q.q)<0)seen.push(q.q)});
  if(seen.length>60)seen.splice(0,seen.length-60);
  return out.map(function(q){var c=Object.assign({},q);c.dif=3;c.rs=c.rs||'aprovado';c.x=1;c.lk='x'+g;return c});
}

   Regras: 1 etapa nova por dia, dias não precisam ser seguidos, 6 perguntas por etapa só de conceitos já vistos,
   sem desafio extra de 5 acertos, recompensas registradas em S.ledger (nunca pagam duas vezes). */

function addDays(d,n){var a=d.split('-'),t=new Date(Date.UTC(+a[0],+a[1]-1,+a[2]+n));return t.toISOString().slice(0,10)}

  return{start:S.devStart,end:addDays(S.devStart,9)};

function evInfo(ev){
  var t=evToday(),w=evWin(ev),P=S.ev[ev.id]||{steps:{}},total=ev.steps.length,done=Object.keys(P.steps).length;
  var doneToday=Object.keys(P.steps).some(function(k){return P.steps[k].day===t});
  var phase=t<w.start?'soon':(t>w.end?'ended':'open');
  var left=dayNum(w.end)-dayNum(t)+1,toStart=dayNum(w.start)-dayNum(t);
  var remaining=total-done,avail=left-(doneToday?1:0),viable=avail>=remaining;
  var completed=done===total;
  var next=ev.steps.filter(function(st){return !P.steps[st.id]})[0]||null;
  var late=phase==='open'&&!completed&&done===0&&!viable;
  var canStart=phase==='open'&&!completed&&!doneToday&&!!next&&!late;
  return{t:t,w:w,P:P,total:total,done:done,doneToday:doneToday,phase:phase,left:left,toStart:toStart,viable:viable,completed:completed,next:next,late:late,canStart:canStart,pieces:P.pieces||0}
}

function evPool(ev){return EVQ.filter(function(q){return eligible(q.cid)})}
/* seleciona as 6 perguntas: só conceitos vistos, mais atenção ao que está frágil, variando conceito e formato */
function evPick(ev){
  var P=S.ev[ev.id]||{},used=P.used||[],n=ev.qPerStep,pool=evPool(ev);

  case 'apt':{
    var sub=r[0];
    if(sub!=='update'&&sub!=='install')return tmErr('apt: use «apt update» ou «apt install pacote»');
    if(!sd)return tmErr('E: Não foi possível abrir o bloqueio. Você é root? (dica: sudo)');
    if(sub==='update'){T.updated=1;return{out:'Lista de pacotes atualizada.'}}
    if(!r[1])return tmErr('apt: informe o pacote');
    var pk=(T.def.pacotes||[]);if(pk.length&&pk.indexOf(r[1])<0)return tmErr('E: Impossível encontrar o pacote '+r[1]);
    T.inst[r[1]]=1;return{out:'Instalando '+r[1]+'... pronto.'};}
  default:
    if(name.indexOf('./')===0||name.charAt(0)==='/'){
      p=tmAbs(name);n=fs[p];
      if(!n)return tmErr('bash: '+name+': Arquivo ou diretório inexistente');
      if(n.d)return tmErr('bash: '+name+': É um diretório');

function tmRun(line){
  var T=TM,toks=tmTok(line),segs=[[]],i;
  toks.forEach(function(t){if(t.op==='|')segs.push([]);else segs[segs.length-1].push(t)});
  var input=null,res={out:''},ok=true,out='';
  for(i=0;i<segs.length;i++){
    var seg=segs[i],args=[],redir=null;
    for(var j=0;j<seg.length;j++){var t=seg[j];
      if(typeof t==='object'){if(!seg[j+1]||typeof seg[j+1]==='object'){return{err:'bash: erro de sintaxe perto de «'+t.op+'»'}}redir={op:t.op,to:seg[j+1]};j++}
      else args.push(t)}
    if(!args.length){if(redir)return{err:'bash: erro de sintaxe'};return{out:''}}
    var sd=false;
    if(args[0]==='sudo'){sd=true;args.shift();if(!args.length)return{err:'sudo: uso: sudo comando'}}
    var ctx={sudo:sd,pipe:i<segs.length-1,redir:!!redir};
    res=tmCmd(args[0],args.slice(1),input,ctx);
    if(res.err)return res;
    out=res.out||'';
    if(redir){
      var p=tmAbs(redir.to),fn=T.fs[p];
      if(fn&&fn.d)return{err:'bash: '+redir.to+': É um diretório'};
      var pr=T.fs[tmDir(p)];
      if(!pr)return{err:'bash: '+redir.to+': Arquivo ou diretório inexistente'};
      if(fn?!tmCan(fn,1,false):pr.o!==T.user)return{err:'bash: '+redir.to+': Permissão negada'};
      if(!fn){T.mk(p,false,'');fn=T.fs[p]}
      fn.t=redir.op==='>>'?(fn.t?fn.t+'\n':'')+out:out;out='';
    }
    input=out;
  }
  return{out:out};
}
function tmCheck(c){
  var T=TM,fs=T.fs,k;
  for(k in c){var v=c[k];
    if(k==='cmd'){if(!T.ran.some(function(x){return new RegExp(v,'i').test(x)}))return false}
    else if(k==='existe'){if(!fs[v])return false}
    else if(k==='naoexiste'){if(fs[v])return false}
    else if(k==='conteudo'){if(!fs[v[0]]||fs[v[0]].t.indexOf(v[1])<0)return false}
    else if(k==='perm'){if(!fs[v[0]]||fs[v[0]].m.slice(0,3).indexOf(v[1])<0)return false}
    else if(k==='semperm'){if(!fs[v[0]]||fs[v[0]].m.slice(0,3).indexOf(v[1])>-1)return false}
    else if(k==='cwd'){if(T.cwd!==v)return false}
    else if(k==='saida'){if(!T.out.some(function(x){return x.k==='o'&&new RegExp(v,'i').test(x.t)}))return false}
    else if(k==='matou'){if(!T.killed[v])return false}
    else if(k==='instalou'){if(!T.inst[v])return false}
    else if(k==='exec'){if(!T.exec[v])return false}
  }
  return true;
}

var GIFT_OPTS={energia:[10,25,50],chips:[10,20,50]};

  /* devolve Promise: {ok:true,gift} ou {ok:false,err} */

    var G=giftsS(),amt=+g.amount||0;
    if(g.type==='energia'){if(GIFT_OPTS.energia.indexOf(amt)<0||S.xp<amt)return Promise.resolve({ok:false,err:'Energia insuficiente.'});S.xp-=amt}
    else if(g.type==='chips'){if(GIFT_OPTS.chips.indexOf(amt)<0||S.gems<amt)return Promise.resolve({ok:false,err:'Chips insuficientes.'});S.gems-=amt}
    else if(g.type==='item'){var ix=(S.inv.items||[]).indexOf(g.item);if(ix<0||!giftItems().some(function(x){return x.id===g.item}))return Promise.resolve({ok:false,err:'Esse item não pode ser dado.'});S.inv.items.splice(ix,1)}
    else return Promise.resolve({ok:false,err:'Presente inválido.'});

    g.opened=true;save();return Promise.resolve({ok:true,gift:g,extra:extra});
  },
  /* só para a prévia: simula um presente chegando de um amigo de mentira */
  mockIncoming:function(from){giftsS().inbox.push({id:giftId(),from:from,type:'chips',amount:20,item:'',msg:'Boa sorte!',at:Date.now()});save()}
};

    body=items.length?'<div class="gitems">'+items.map(function(it){return '<button class="gopt'+(GU.item===it.id?' on':'')+'" data-act="gitem" data-i="'+esc(it.id)+'"><b>'+esc(it.nome)+'</b><small>Item de evento</small></button>'}).join('')+'</div><p class="note" style="margin:8px 0 0">Ao dar, você deixa de ter o item.</p>'
      :'<p class="note" style="margin:8px 0">Você ainda não tem itens de evento para dar. Eles vêm de eventos especiais.</p>';
    ok=!!GU.item;
  }else{
    var bal=GU.tab==='chips'?S.gems:S.xp;
    body='<div class="gamts">'+GIFT_OPTS[GU.tab].map(function(a){var lock=bal<a;return '<button class="gopt'+(GU.amt===a?' on':'')+(lock?' lock':'')+'" data-act="gamt" data-a="'+a+'"'+(lock?' disabled':'')+'><b>'+a+'</b><small>'+(GU.tab==='chips'?'chips':'energia')+'</small></button>'}).join('')+'</div>';
    ok=GU.amt>0&&bal>=GU.amt;
  }
  var h='<div class="sheet tall" role="dialog" aria-label="Enviar presente"><h2 style="margin:0 0 2px">Presente para '+esc(GU.to)+'</h2>'+
   '<p class="note" style="margin:0 0 10px">Seu saldo: '+S.xp+' de energia · '+S.gems+' chips</p>'+
   '<div class="gtabs">'+[['chips','Chips'],['energia','Energia'],['item','Item do robô']].map(function(t){return '<button class="gtab'+(GU.tab===t[0]?' on':'')+'" data-act="gtab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>'+body+
   '<label class="frl" style="margin-top:14px">Recado</label><div class="gmsgs">'+GIFT_MSGS.map(function(m,i){return '<button class="gmsg'+(GU.msg===i?' on':'')+'" data-act="gmsg" data-m="'+i+'">'+m+'</button>'}).join('')+'</div>'+
   '<button class="btn prim" data-act="gsend" style="margin-top:16px"'+(ok?'':' disabled')+'>Enviar presente</button>'+
   '<button class="btn ghost" data-act="amigos" style="margin-top:10px">Voltar</button>'+
   '<p class="note" style="margin:10px 0 0">Prévia: o presente ainda não chega a pessoas de verdade. Quando criarmos as contas online, ele é entregue.</p></div>';
  $('#modal').innerHTML=h;$('#modal').hidden=false;
}
function giftSend(){
  var g={type:GU.tab,amount:GU.tab==='item'?0:GU.amt,item:GU.tab==='item'?GU.item:'',msg:GIFT_MSGS[GU.msg]};
  GiftAPI.send(GU.to,g).then(function(r){
    if(!r.ok){showGift(GU.to,1);return}
    $('#modal').innerHTML='<div class="sheet" role="dialog" aria-label="Presente enviado"><div class="gdone"><div class="gbox">'+IC.gift+'</div><h2>Presente enviado!</h2><p class="note">'+esc(GU.to)+' vai receber '+esc(giftDesc(r.gift))+'.</p></div><button class="btn prim" data-act="amigos">Pronto</button></div>';
    sfx('win');buzz([20,40,30]);confetti();render();
  });
}
function showInbox(){
  GiftAPI.inbox().then(function(list){
    var h='<div class="sheet tall" role="dialog" aria-label="Presentes recebidos"><h2 style="margin:0 0 8px">Presentes para você</h2>'+
     (list.length?list.map(function(g){return '<div class="grow"><span class="gbox sm">'+IC.gift+'</span><div class="frn"><b>'+esc(g.from)+' mandou '+esc(giftDesc(g))+'</b><small>'+esc(g.msg||'')+'</small></div><button class="btn prim gopen" data-act="gopen" data-id="'+g.id+'">Abrir</button></div>'}).join(''):'<p class="note">Nenhum presente esperando.</p>')+
     '<button class="btn ghost" data-act="amigos" style="margin-top:12px">Voltar</button></div>';

}
function giftOpen(id){
  GiftAPI.claim(id).then(function(r){
    if(!r.ok){showInbox();return}
    var g=r.gift;
    $('#modal').innerHTML='<div class="sheet" role="dialog" aria-label="Presente aberto"><div class="gdone"><div class="gbox pop">'+IC.gift+'</div><h2>'+esc(g.from)+' mandou '+esc(giftDesc(g))+'!</h2><p class="note">'+(r.extra?'Você já tinha esse item, então ganhou '+r.extra+' chips.':'Já está com você.')+'</p></div><button class="btn prim" data-act="ginbox">Continuar</button></div>';
    sfx('win');buzz([20,40,30]);confetti();render();

}

function amToast(t){var e=$('#modal .frmsg');if(!e){var d=document.createElement('div');d.className='frmsg';var sh=$('#modal .sheet');if(sh)sh.insertBefore(d,sh.children[1]);e=d}if(e)e.textContent=t}

/* ---------- duelo: contra a máquina ou contra um amigo (por link, sem servidor) ---------- */
var DU_LV=[['ini','Iniciante',true],['int','Intermediário',false],['ava','Avançado',false]];
var DU_N=7,D=null,DUS={mode:'bot',g:'roleta',lv:'ini'};
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuf(arr,r){arr=arr.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=arr[i];arr[i]=arr[j];arr[j]=t}return arr}
function duelPool(g){var seen={},out=[];GAMES[g].phases.forEach(function(ph){ph.forEach(function(q){if((q.t==='mc'||q.t==='vf')&&!seen[q.q]){seen[q.q]=1;out.push(q)}})});return out}
function duelQs(g,seed,n){
  var r=rng(seed),pool=duelPool(g),idx=sshuf(pool.map(function(_,i){return i}),r).slice(0,Math.min(n,pool.length));
  return idx.map(function(i){var q=pool[i];
    if(q.t==='vf')return{t:'vf',q:q.q,opts:[{t:'Verdadeiro',c:q.a===true},{t:'Falso',c:q.a===false}],e:q.e};
    return{t:'mc',q:q.q,opts:sshuf(q.o.map(function(t,k){return{t:t,c:k===q.a}}),r),e:q.e}});
}
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){try{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return JSON.parse(decodeURIComponent(escape(atob(t))))}catch(e){return null}}
function duelLink(){return location.href.split('#')[0]+'#duelo='+b64e({g:D.g,s:D.s,n:D.qs.length,l:D.lv,f:S.nick||'Um amigo',r:D.me})}
function duelCard(){
  var st=S.duel||{w:0,l:0,d:0};
  return '<div class="card duelc"><div class="duelh"><span class="duelic">'+IC.bolt+'</span><div><h3 style="margin:0">Duelo</h3><small>Desafie a máquina ou um amigo: quem acertar mais, ganha.</small></div></div>'+
   '<button class="btn prim" data-act="duelo" style="margin-top:10px">Jogar duelo</button>'+
   ((st.w+st.l+st.d)?'<p class="note" style="margin:8px 0 0">Seu placar: '+st.w+(st.w===1?' vitória':' vitórias')+' · '+st.d+(st.d===1?' empate':' empates')+' · '+st.l+(st.l===1?' derrota':' derrotas')+'</p>':'')+'</div>';
}
function duelShell(inner,title){
  L={kind:'duel'};$('#lesson').hidden=false;document.body.classList.add('lock');
  $('#lesson').innerHTML='<div class="duel"><div class="dutop"><button class="dux" data-act="dclose" aria-label="Fechar">×</button><b>'+(title||'Duelo')+'</b><span></span></div><div class="dubody">'+inner+'</div></div>';
}
function duelSetup(){
  var m=DUS.mode,h='<div class="dsec">Contra quem?</div><div class="dchips">'+
   '<button class="dchip'+(m==='bot'?' on':'')+'" data-act="dmode" data-m="bot"><b>Máquina</b><small>Joga agora</small></button>'+
   '<button class="dchip'+(m==='amigo'?' on':'')+'" data-act="dmode" data-m="amigo"><b>Amigo</b><small>Você joga e manda o link</small></button></div>'+
   '<div class="dsec">Sobre o quê?</div><button class="dth rol'+(DUS.g==='roleta'?' on':'')+'" data-act="dtheme" data-g="roleta"><span class="dthi">'+WHEEL_MINI+'</span><span><b>Roleta do Pingo</b><small>O Pingo sorteia o tema</small></span></button><div class="dthemes">'+
   GAMES.map(function(g,i){return '<button class="dth'+(DUS.g===i?' on':'')+'" data-act="dtheme" data-g="'+i+'" style="--ti:'+DU_COL[i%DU_COL.length]+'"><span class="dthi">'+duIcon(i)+'</span><b>'+g.title+'</b></button>'}).join('')+'</div>'+
   '<div class="dsec">Nível</div><div class="dchips">'+DU_LV.map(function(l){return '<button class="dchip'+(DUS.lv===l[0]?' on':'')+(l[2]?'':' lock')+'" data-act="dlv" data-l="'+l[0]+'"'+(l[2]?'':' disabled')+'><b>'+l[1]+'</b><small>'+(l[2]?'Disponível':'Em breve')+'</small></button>'}).join('')+'</div>'+
   '<button class="btn prim" data-act="dgo" style="margin-top:18px">'+(DUS.g==='roleta'?'Abrir a roleta':'Começar duelo')+'</button>';
  duelShell(h,'Novo duelo');
}
var DU_COL=['#7b3ff2','#ff9a1f','#18b4d8','#ff4fae','#3fbf5f','#6a5cff','#e59a00','#e0457b','#0f9fb8','#8a4bff'];
DV.net='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M10.800 7.200L6.200 15.800M13.200 7.200l4.600 8.600M7.600 18h8.800"/></svg>';
var DU_IC=['pc','router','cable','cloud','server','book','bolt','printer','net','lock'];
function duIcon(i){var k=DU_IC[i%DU_IC.length];return (DV[k]||IC[k]||'')}
var WHEEL_MINI='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffd83d" stroke="#e59a00" stroke-width="1.6"/><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19" stroke="#e59a00" stroke-width="1.2"/><circle cx="12" cy="12" r="2.4" fill="#fff" stroke="#e59a00" stroke-width="1.2"/></svg>';
function wheelSvg(){
  var n=GAMES.length,seg=360/n,R=140,C=150,h='<svg viewBox="0 0 300 300" class="rolsvg" aria-hidden="true"><g id="rolg">';
  for(var i=0;i<n;i++){
    var a0=(i*seg-90)*Math.PI/180,a1=((i+1)*seg-90)*Math.PI/180;
    var x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);
    h+='<path d="M'+C+' '+C+'L'+x0.toFixed(1)+' '+y0.toFixed(1)+'A'+R+' '+R+' 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+'Z" fill="'+DU_COL[i%DU_COL.length]+'" stroke="#fff" stroke-width="3"/>';
    var mid=(i+0.5)*seg;
    h+='<g transform="rotate('+mid+' '+C+' '+C+')" style="color:#fff">'+duIcon(i).replace('<svg','<svg x="'+(C-15)+'" y="'+(C-R+14)+'" width="30" height="30"')+'</g>';
  }
  h+='</g><g class="rolhub"><circle cx="150" cy="150" r="22" fill="#fff" stroke="#ffd83d" stroke-width="6"/><circle cx="150" cy="150" r="7" fill="#7b3ff2"/></g></svg>';
  return h;
}
var ROLBUSY=false;
function duelWheel(){
  var root=$('#lesson .duel');if(!root)return;
  var ov=document.createElement('div');ov.className='rolbk';ov.innerHTML='<div class="rolbox" role="dialog" aria-label="Roleta do Pingo"><button class="dux rolx" data-act="rolclose" aria-label="Fechar">×</button><h2>Roleta do Pingo</h2>'+
   '<div class="rolwrap" data-act="rolgo" role="button" aria-label="Girar a roleta" tabindex="0"><div class="rolptr"></div>'+wheelSvg()+'</div><div class="rolres" id="rolres">&nbsp;</div></div>';
  root.appendChild(ov);
}
function duelRoll(){
  if(ROLBUSY)return;var g=$('#rolg'),res=$('#rolres');if(!g)return;
  ROLBUSY=true;var wr=$('.rolwrap');if(wr)wr.classList.add('spun');
  var n=GAMES.length,seg=360/n,fin=Math.floor(Math.random()*n),jit=(Math.random()-0.5)*seg*0.6;
  var total=360*5+(360-(fin*seg+seg/2+jit)),dur=NOANIM?1:5200,t0=null,last=-1,ptr=$('.rolptr');
  function ease(x){return 1-Math.pow(1-x,4)}
  function frame(ts){
    if(!$('#rolg')){ROLBUSY=false;return}
    if(t0===null)t0=ts;var x=Math.min(1,(ts-t0)/dur),th=total*ease(x);
    g.setAttribute('transform','rotate('+th.toFixed(2)+' 150 150)');
    var idx=Math.floor((((360-(th%360))%360))/seg);
    if(idx!==last){last=idx;sfx('tick');buzz([6]);if(ptr&&!NOANIM){ptr.classList.remove('hit');void ptr.offsetWidth;ptr.classList.add('hit')}}
    if(x<1)requestAnimationFrame(frame);
    else{ROLBUSY=false;res.innerHTML='<span class="dthi" style="--ti:'+DU_COL[fin%DU_COL.length]+'">'+duIcon(fin)+'</span><b>'+GAMES[fin].title+'</b>';res.classList.add('pop');sfx('win');buzz([20,40,30]);confetti();
      setTimeout(function(){if(!$('#rolg'))return;var seed=(Math.random()*4294967295)>>>0;duelBegin(fin,seed,DUS.lv,DUS.mode,null)},NOANIM?300:1800)}
  }
  requestAnimationFrame(frame);
}
function duelBegin(g,seed,lv,mode,opp){
  var qs=duelQs(g,seed,DU_N);
  D={g:g,s:seed,lv:lv,mode:mode,qs:qs,i:0,me:[],sel:null,opp:opp};
  if(mode==='bot'){var r=rng(seed^0x9e3779b9),p=0.62;D.opp={name:'Byte',r:qs.map(function(){return r()<p?1:0}),bot:true}}
  duelDraw();
}
function duelStart(){
  var seed=(Math.random()*4294967295)>>>0;
  if(DUS.g==='roleta'){duelWheel();return}
  duelBegin(DUS.g,seed,DUS.lv,DUS.mode,null);
}
function duelScore(a,upto){var n=0;for(var i=0;i<(upto==null?a.length:upto);i++)n+=a[i]?1:0;return n}
function duelDraw(){
  var q=D.qs[D.i],n=D.qs.length,ans=D.sel!==null,show=D.opp&&D.opp.bot;
  var mine=duelScore(D.me),his=show?duelScore(D.opp.r,D.me.length):null;
  var h='<div class="duhud"><div class="dus me"><small>Você</small><b>'+mine+'</b></div><div class="dumid">Pergunta '+(D.i+1)+' de '+n+'</div><div class="dus"><small>'+(show?'Byte':(D.opp?esc(D.opp.name):'Amigo'))+'</small><b>'+(show?his:'?')+'</b></div></div>'+
   '<div class="dubar"><i style="width:'+(D.i/n*100)+'%"></i></div><h2 class="duq">'+esc(q.q)+'</h2><div class="duopts">';
  q.opts.forEach(function(o,i){
    var cls='duopt';if(ans){if(o.c)cls+=' ok';else if(D.sel===i)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-act="dpick" data-i="'+i+'"'+(ans?' disabled':'')+'>'+esc(o.t)+'</button>';
  });
  h+='</div>';
  if(ans){var ok=q.opts[D.sel].c;h+='<div class="dufb '+(ok?'ok':'bad')+'"><b>'+(ok?'Acertou!':'Errou.')+'</b> '+esc(q.e||'')+'</div>'+
    (show?'<p class="note" style="text-align:center">Byte '+(D.opp.r[D.i]?'acertou':'errou')+' essa.</p>':'')+
    '<button class="btn prim" data-act="dnext">'+(D.i+1>=n?'Ver resultado':'Próxima')+'</button>'}
  duelShell(h,D.mode==='bot'?'Duelo contra Byte':'Duelo');
}
function duelPick(i){
  if(D.sel!==null)return;var ok=D.qs[D.i].opts[i].c;D.sel=i;D.me.push(ok?1:0);
  sfx(ok?'ok':'bad');buzz(ok?[12]:[30]);duelDraw();
}
function duelNext(){D.i++;D.sel=null;if(D.i>=D.qs.length)duelEnd();else duelDraw()}
function dots(a){return a.map(function(x){return '<i class="dd '+(x?'ok':'bad')+'"></i>'}).join('')}
function duelEnd(){
  var me=duelScore(D.me),n=D.qs.length,opp=D.opp,h='',link=duelLink();
  if(opp&&opp.r){
    var he=duelScore(opp.r),res=me>he?'w':(me<he?'l':'d');
    S.duel=S.duel||{w:0,l:0,d:0};S.duel[res]++;save();
    h+='<div class="dures">'+pingo(res==='w'?'cheer':(res==='l'?'sad':'happy'),'pingo-big')+'<h1>'+(res==='w'?'Você venceu!':(res==='l'?esc(opp.name)+' venceu':'Empate!'))+'</h1>'+
     '<div class="duvs"><div class="dus me"><small>Você</small><b>'+me+'</b></div><span>×</span><div class="dus"><small>'+esc(opp.name)+'</small><b>'+he+'</b></div></div>'+
     '<div class="dudots"><span>Você</span>'+dots(D.me)+'</div><div class="dudots"><span>'+esc(opp.name)+'</span>'+dots(opp.r)+'</div></div>';
    if(res==='w'){sfx('win');confetti()}
    h+='<button class="btn prim" data-act="drematch">Revanche</button>';
    if(opp.bot)h+='<button class="btn ghost" data-act="dshare" data-l="'+esc(link)+'" style="margin-top:10px">Desafiar um amigo com estas perguntas</button>';
    else h+='<button class="btn ghost" data-act="dnew" style="margin-top:10px">Novo duelo</button>';
  }else{
    h+='<div class="dures">'+pingo('cheer','pingo-big')+'<h1>Você acertou '+me+' de '+n+'</h1><p class="note">Agora mande o link para seu amigo jogar as mesmas perguntas. Quando ele terminar, o app mostra quem venceu.</p><div class="dudots"><span>Você</span>'+dots(D.me)+'</div></div>'+
     '<div class="frlink">'+esc(link)+'</div><button class="btn prim" data-act="dshare" data-l="'+esc(link)+'">Mandar desafio</button><button class="btn ghost" data-act="dcopy" data-l="'+esc(link)+'" style="margin-top:10px">Copiar link</button>';
  }
  h+='<button class="btn ghost" data-act="dclose" style="margin-top:10px">Sair</button><div class="frmsg" hidden></div>';
  duelShell(h,'Resultado');
}
function duelIntro(d){
  var g=GAMES[d.g];
  if(!g||!d.s||!d.r){closeLesson();return}
  D={pend:d};
  duelShell('<div class="dures">'+pingo('cheer','pingo-big')+'<h1>'+esc(d.f||'Um amigo')+' te desafiou!</h1><p class="note">Tema: <b>'+g.title+'</b> · '+d.n+' perguntas · nível '+(d.l==='ini'?'iniciante':esc(d.l))+'. Quem acertar mais, ganha.</p></div>'+
   '<button class="btn prim" data-act="daccept">Aceitar desafio</button><button class="btn ghost" data-act="dclose" style="margin-top:10px">Agora não</button>','Desafio');
}
function duelAccept(){var d=D.pend;duelBegin(d.g,d.s,d.l,'amigo',{name:d.f||'Amigo',r:d.r})}
function duelToast(t){var e=$('#lesson .frmsg');if(e){e.hidden=false;e.textContent=t}}

var DUEL_PEND=null;try{var dm=location.hash.match(/duelo=([A-Za-z0-9_-]+)/);if(dm)DUEL_PEND=b64d(dm[1])}catch(e){}
if(DUEL_PEND&&DUEL_PEND.g!=null)duelIntro(DUEL_PEND);else showWelcome();
try{var mh=location.hash.match(/convite=([A-Z0-9]{4,8})/);if(mh&&S.onb)showAmigos(mh[1])}catch(e){}
</script>
