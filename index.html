<title>Pingo Quest</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: trilha vertical em zigue-zague, estilo app de lições; mascote Pingo (um roteador) */
:root{
  /* Paleta oficial do guia visual do Pingo Quest. Padrão: modo claro (branco). Modo escuro: roxo neon. */
  --roxo:#7b3ff2; --roxo-fundo:#2a0a66; --lilas:#c88bff; --ciano-neon:#18ddfb; --rosa:#ff4fae; --amarelo:#ffd83d; --laranja:#ff9a1f; --verde:#7dff2b; --branco:#fff;
  --bg:#ffffff; --surface:#ffffff; --ink:#1f1642; --muted:#6c6492;
  --line:#e6e1f6; --line-deep:#d4cdee;
  --primary:#7b3ff2; --primary-deep:#5a22c4; --on-primary:#ffffff;
  --ok:#3fc83f; --ok-deep:#2a9a2a; --ok-bg:#e4f9d8; --ok-ink:#27730f;
  --bad:#ff4d6d; --bad-deep:#cf2f4e; --bad-bg:#ffe4ea; --bad-ink:#b0213f;
  --gold:#ffd83d; --gold-deep:#d9a400; --cyan:#0fa8d4;
  --locked:#ebe8f6; --locked-deep:#d6d0ea;
  --face:#1b1240;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#150638; --surface:#211052; --ink:#ffffff; --muted:#b9a9e4;
  --line:#3d2a8f; --line-deep:#31207a;
  --ok:#7dff2b; --ok-deep:#4fb80e; --ok-bg:#24511c; --ok-ink:#c4ff9a;
  --bad:#ff5a7a; --bad-deep:#cf3050; --bad-bg:#561344; --bad-ink:#ffc0d0;
  --cyan:#18ddfb;
  --locked:#41208f; --locked-deep:#2e1470;
  --face:#12052e;
  color-scheme:dark;
}

*{box-sizing:border-box}
:root[data-theme="dark"] body{background-image:linear-gradient(180deg,#1b0944,#12053a);background-attachment:fixed}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
svg{display:block}

/* barra de status */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding-inline:max(16px,env(safe-area-inset-left,0px));
  border-bottom:2px solid var(--line)}
#top .wrap{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;gap:8px}
.stat{display:flex;align-items:center;gap:7px;font-weight:900;font-size:18px}
.stat svg{width:24px;height:24px}

.btn.blue{background:var(--cyan);box-shadow:0 5px 0 #0e87b3;color:#04202c}

.btn.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 var(--bad-deep)}

.uhead{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:18px;padding:14px 16px;color:#fff;
  background:var(--uh);box-shadow:0 5px 0 var(--ud)}

  padding:7px 13px;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase}

.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 8px}
.nw{position:relative;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.node svg{width:34px;height:34px}
.node.done{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep);color:#fff}
.node.cur{background:var(--uh,var(--primary));box-shadow:0 6px 0 var(--ud,var(--primary-deep)),0 0 22px color-mix(in srgb,var(--uh,#7b3ff2) 70%,transparent);color:#fff}
.node.lock{background:color-mix(in srgb,var(--uh,#7b3ff2) 18%,var(--locked));box-shadow:0 6px 0 var(--locked-deep);color:var(--muted);cursor:not-allowed}

.nlabel{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.bubble{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line-deep);
  color:var(--cyan);font-weight:900;font-size:13px;letter-spacing:.07em;padding:6px 12px;border-radius:12px;white-space:nowrap;
  animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);
  border-right:2px solid var(--line-deep);border-bottom:2px solid var(--line-deep);transform:translateX(-50%) rotate(45deg)}
.pingo{position:absolute;top:2px;width:64px}
.pingo.l{right:calc(100% + 14px)}.pingo.r{left:calc(100% + 14px)}

  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.lw{width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:10px 0}

.nickbtn{margin-top:6px;border:2px solid var(--line);background:var(--surface);color:var(--primary-deep);font:inherit;font-weight:800;font-size:13px;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}

.duelc .duelh{display:flex;gap:12px;align-items:center}.duelc small{color:var(--muted);font-weight:700}
.duelic{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--amarelo) 40%,var(--surface));display:grid;place-items:center;flex:none}.duelic svg{width:26px;height:26px}

#evfab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:30;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit;

/* Mundo: a trilha é o cenário */
.unit{--uh:#7b3ff2;--ud:#5a22c4;background:linear-gradient(180deg,rgba(150,225,185,.22),rgba(200,139,255,.12));border-radius:26px;padding:12px 10px 18px;margin-top:16px}

/* trilha do mundo: uma parada por lugar */
.wtrail{position:relative;margin:0 -4px;padding:18px 0 30px;border-radius:26px;background:linear-gradient(180deg,rgba(150,225,185,.2),rgba(200,139,255,.14))}

.sring{position:relative;z-index:1;transform:translateX(var(--x));width:92px;height:92px;border-radius:50%;border:0;padding:0;background:conic-gradient(#ffd83d calc(var(--p)*1%),rgba(123,63,242,.16) 0);display:grid;place-items:center;cursor:pointer}
.sdisc{width:78px;height:78px;border-radius:50%;background:#7b3ff2;box-shadow:0 6px 0 #5a22c4;display:grid;place-items:center;transition:transform .08s}

.stop.done .sring{background:#8ccfa9}.stop.done .sdisc{background:#8ccfa9;box-shadow:0 6px 0 #5fa882}
.stop.lock .sring{background:rgba(123,63,242,.1)}.stop.lock .sdisc{background:#d9d1f2;box-shadow:0 6px 0 #bdb3e0}.stop.lock .sdisc svg{color:#fff;fill:#fff}

.slbl{position:absolute;top:14px;max-width:132px;z-index:2;pointer-events:none}
.slbl.L{left:calc(50% + var(--x) + 56px)}.slbl.R{right:calc(50% - var(--x) + 56px);text-align:right}
.slbl b{display:block;font-size:15px;line-height:1.15;color:var(--ink)}.slbl small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:1px}.slbl i{display:block;font-style:normal;font-size:11px;font-weight:900;color:var(--primary);margin-top:3px;letter-spacing:.04em}
.stop.lock .slbl b{color:var(--muted)}
.spingo{position:absolute;z-index:2;width:56px;top:10px;pointer-events:none}.spingo.l{left:calc(50% + var(--x) - 106px)}.spingo.r{left:calc(50% + var(--x) + 50px)}
.sbub{position:absolute;z-index:3;top:-22px;left:calc(50% + var(--x));transform:translateX(-50%);background:var(--surface);color:var(--primary);border:2px solid var(--line-deep);border-radius:12px;padding:3px 10px;font-weight:900;font-size:12px;box-shadow:0 3px 0 var(--line-deep)}
.shead{display:flex;gap:14px;align-items:center;margin-bottom:12px}.shead h2{margin:0;font-size:22px}.shead .tag{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--primary);text-transform:uppercase}

.srow.done .sri{background:#8ccfa9}.srow.lock{opacity:.6;cursor:default}.srow.lock .sri{background:#cfc6ec}.srow.fin .sri{background:#ff9a1f}.srow.fin.done .sri{background:#8ccfa9}.srow.fin.lock .sri{background:#e8d8c4}
.srt{flex:1;min-width:0}.srt small{display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.srt b{display:block;font-size:15px;line-height:1.2}

/* Pingo faz gestos (palmas, tchau, pulo) nas telas de comemoração */
var PACT={clap:1000,wave:1900,jump:1500};
function pingoAct(sv,name){
  if(!sv||!sv.isConnected)return;
  ['clap','wave','jump'].forEach(function(a){sv.classList.remove('act-'+a)});
  void sv.getBoundingClientRect();sv.classList.add('act-'+name);
  setTimeout(function(){sv.classList.remove('act-'+name)},PACT[name]+40);
}
function pingoShow(sv){
  var order=['clap','wave','jump'],i=Math.floor(Math.random()*3),n=0;
  (function step(){
    if(!sv.isConnected||n>=4)return;
    var a=order[i++%3];n++;pingoAct(sv,a);setTimeout(step,PACT[a]+700);
  })();
}
(function(){

      var sv=nd.matches&&nd.matches('svg[data-m="cheer"]')?nd:nd.querySelector&&nd.querySelector('svg[data-m="cheer"]');
      if(sv)setTimeout(function(){pingoShow(sv)},450);
    })});
  });

})();

/* ===== Fase 1: estrutura de conhecimento =====
   CUR: conceitos {n:nome, pre:[pré-requisitos], l:"jogo-fase" onde o conceito é apresentado}
   Cada pergunta recebe: cid (conceito), dif (1-3), rs (status de revisão), lk (fase de origem).
   S.know[cid] = {seen, ok, bad, last}: o que o aluno viu e como foi. */
var PHCON={};Object.keys(CUR).forEach(function(id){var l=CUR[id].l;(PHCON[l]=PHCON[l]||[]).push(id)});
function knowOf(c){if(!S.know)S.know={};return S.know[c]||(S.know[c]={ok:0,bad:0,seen:0,last:''})}
function isSeen(c){return !!(S.know&&S.know[c]&&S.know[c].seen)}
function markSeen(cs){var ch=false;(cs||[]).forEach(function(c){var k=knowOf(c);if(!k.seen){k.seen=1;k.at=today();ch=true}});if(ch)save()}
function eligible(c){var d=CUR[c];return !!d&&isSeen(c)&&d.pre.every(isSeen)}
function eligibleQs(opt){opt=opt||{};return allQs().filter(function(q){return q.rs!=='rascunho'&&eligible(q.cid)&&(!opt.maxDif||q.dif<=opt.maxDif)&&(!opt.cid||q.cid===opt.cid)})}
function masteryOf(c){var k=S.know&&S.know[c];if(!k||!k.seen)return'novo';var n=k.ok+k.bad;if(n<3)return'aprendendo';var a=k.ok/n;if(a>=.85&&k.ok>=6)return'dominado';return a<.65?'fragil':'aprendendo'}

backfillKnow();

function pickExtras(g){
  var base=(EXTRA[g]||[]),ph=(GAMES[g]&&GAMES[g].phases)||[],seen=S.xseen||(S.xseen=[]);
  var more=[];ph.forEach(function(p){p.forEach(function(q){if((q.t==='mc'||q.t==='vf')&&q.o!==undefined||q.t==='vf')more.push(q)})});
  var pool=base.concat(more).filter(function(q){return q.t!=='learn'&&eligible(q.cid)});
  var fresh=pool.filter(function(q){return seen.indexOf(q.q)<0});
  if(fresh.length<3){seen.length=0;fresh=pool}
  var out=[],cids={};
  shuffle(fresh).forEach(function(q){if(out.length<3&&!cids[q.cid]){out.push(q);cids[q.cid]=1}});
  shuffle(fresh).forEach(function(q){if(out.length<3&&out.indexOf(q)<0)out.push(q)});
  out.forEach(function(q){if(seen.indexOf(q.q)<0)seen.push(q.q)});
  if(seen.length>60)seen.splice(0,seen.length-60);
  return out.map(function(q){var c=Object.assign({},q);c.dif=3;c.rs=c.rs||'aprovado';c.x=1;c.lk='x'+g;return c});
}

  return{t:t,w:w,P:P,total:total,done:done,doneToday:doneToday,phase:phase,left:left,toStart:toStart,viable:viable,completed:completed,next:next,late:late,canStart:canStart,pieces:P.pieces||0}
}

function evPool(ev){return EVQ.filter(function(q){return eligible(q.cid)})}
/* seleciona as 6 perguntas: só conceitos vistos, mais atenção ao que está frágil, variando conceito e formato */
function evPick(ev){
  var P=S.ev[ev.id]||{},used=P.used||[],n=ev.qPerStep,pool=evPool(ev);
  var fresh=pool.filter(function(q){return used.indexOf(q.q)<0});
  if(fresh.length>=n)pool=fresh;
  if(pool.length<n)return{need:n,have:pool.length};
  var W={fragil:3,aprendendo:2,novo:2,dominado:1};
  var sc=pool.map(function(q){return{q:q,s:(W[masteryOf(q.cid)]||1)+Math.random()*2}}).sort(function(a,b){return b.s-a.s}).map(function(x){return x.q});
  var out=[],cnt={},ty={};
  [[1,1],[2,2],[2,9],[9,9]].forEach(function(lim){
    sc.forEach(function(q){
      if(out.length>=n||out.indexOf(q)>=0)return;
      if((cnt[q.cid]||0)<lim[0]&&(ty[q.t]||0)<lim[1]){out.push(q);cnt[q.cid]=(cnt[q.cid]||0)+1;ty[q.t]=(ty[q.t]||0)+1}
    });
  });
  return shuffle(out);
}

var L=null;
function prep(q){
  var c=Object.assign({},q);c.src=q;
  if(q.t==='mc'){c.opts=shuffle(q.o.map(function(t,i){return{t:t,c:i===q.a}}))}
  if(q.t==='mp'){c.left=q.pairs.map(function(p,i){return{id:i,t:p[0]}});c.right=shuffle(q.pairs.map(function(p,i){return{id:i,t:p[1]}}))}
  if(q.t==='bl'){
    var bank,tries=0;
    do{bank=shuffle(q.blocks.map(function(t,i){return{id:i,t:t}}));tries++}
    while(tries<8&&bank.map(function(b){return b.t}).join('|')===q.a.join('|'));
    c.bank=bank;
  }
  if(q.t==='fill'){c.n=q.ans.length;c.bank=shuffle(q.ans.concat(q.extra||[]).map(function(t,i){return{id:i,t:t}}))}
  if(q.t==='cl'){c.ci=shuffle(q.items.map(function(x,i){return{id:i,t:x[0],c:x[1]}}))}
  return c;
}

function mpTap(side,id){
  var q=curQ(),m=L.mp;if(!m||L.state!=='ask'||m.flash)return;
  if(!m.sel||m.sel.side===side){m.sel={side:side,id:id};drawLesson();return}

  if(q.t==='cl')ok=q.ci.every(function(it){return L.sel[it.id]===it.c});
  if(q.t==='ty'){var v=nrm(L.sel);ok=q.a.some(function(a){var n=nrm(a);return v===n||(n.length>=6&&lev(v,n)<=1)})}

  if(q.cid){var kk=knowOf(q.cid);kk.seen=kk.seen||1;if(ok)kk.ok++;else kk.bad++;kk.last=today()}
  if(ok){S.ok++;L.right++;gotRight();if(L.kind==='review')fixMiss(q)}

function tmRun(line){
  var T=TM,toks=tmTok(line),segs=[[]],i;
  toks.forEach(function(t){if(t.op==='|')segs.push([]);else segs[segs.length-1].push(t)});
  var input=null,res={out:''},ok=true,out='';
  for(i=0;i<segs.length;i++){
    var seg=segs[i],args=[],redir=null;
    for(var j=0;j<seg.length;j++){var t=seg[j];
      if(typeof t==='object'){if(!seg[j+1]||typeof seg[j+1]==='object'){return{err:'bash: erro de sintaxe perto de «'+t.op+'»'}}redir={op:t.op,to:seg[j+1]};j++}
      else args.push(t)}
    if(!args.length){if(redir)return{err:'bash: erro de sintaxe'};return{out:''}}
    var sd=false;
    if(args[0]==='sudo'){sd=true;args.shift();if(!args.length)return{err:'sudo: uso: sudo comando'}}
    var ctx={sudo:sd,pipe:i<segs.length-1,redir:!!redir};
    res=tmCmd(args[0],args.slice(1),input,ctx);
    if(res.err)return res;
    out=res.out||'';
    if(redir){
      var p=tmAbs(redir.to),fn=T.fs[p];
      if(fn&&fn.d)return{err:'bash: '+redir.to+': É um diretório'};
      var pr=T.fs[tmDir(p)];
      if(!pr)return{err:'bash: '+redir.to+': Arquivo ou diretório inexistente'};
      if(fn?!tmCan(fn,1,false):pr.o!==T.user)return{err:'bash: '+redir.to+': Permissão negada'};
      if(!fn){T.mk(p,false,'');fn=T.fs[p]}
      fn.t=redir.op==='>>'?(fn.t?fn.t+'\n':'')+out:out;out='';
    }
    input=out;
  }
  return{out:out};
}
function tmCheck(c){
  var T=TM,fs=T.fs,k;
  for(k in c){var v=c[k];
    if(k==='cmd'){if(!T.ran.some(function(x){return new RegExp(v,'i').test(x)}))return false}
    else if(k==='existe'){if(!fs[v])return false}
    else if(k==='naoexiste'){if(fs[v])return false}
    else if(k==='conteudo'){if(!fs[v[0]]||fs[v[0]].t.indexOf(v[1])<0)return false}
    else if(k==='perm'){if(!fs[v[0]]||fs[v[0]].m.slice(0,3).indexOf(v[1])<0)return false}
    else if(k==='semperm'){if(!fs[v[0]]||fs[v[0]].m.slice(0,3).indexOf(v[1])>-1)return false}
    else if(k==='cwd'){if(T.cwd!==v)return false}
    else if(k==='saida'){if(!T.out.some(function(x){return x.k==='o'&&new RegExp(v,'i').test(x.t)}))return false}
    else if(k==='matou'){if(!T.killed[v])return false}
    else if(k==='instalou'){if(!T.inst[v])return false}
    else if(k==='removeu'){if(!T.rem[v])return false}
    else if(k==='ssh'){if(!(T.ssh&&T.ssh[v]))return false}
    else if(k==='scp'){if(!(T.scp&&T.scp[v]))return false}
    else if(k==='exec'){if(!T.exec[v])return false}
  }
  return true;
}

  }else{
    h+='<div class="dures">'+pingo('cheer','pingo-big')+'<h1>Você acertou '+me+' de '+n+'</h1><p class="note">Agora mande o link para seu amigo jogar as mesmas perguntas. Quando ele terminar, o app mostra quem venceu.</p><div class="dudots"><span>Você</span>'+dots(D.me)+'</div></div>'+
     '<div class="frlink">'+esc(link)+'</div><button class="btn prim" data-act="dshare" data-l="'+esc(link)+'">Mandar desafio</button><button class="btn ghost" data-act="dcopy" data-l="'+esc(link)+'" style="margin-top:10px">Copiar link</button>';
  }
  h+='<button class="btn ghost" data-act="dclose" style="margin-top:10px">Sair</button><div class="frmsg" hidden></div>';
  duelShell(h,'Resultado');
}
function duelIntro(d){
  var g=GAMES[d.g];
  if(!g||!d.s||!d.r){closeLesson();return}
  D={pend:d};
  duelShell('<div class="dures">'+pingo('cheer','pingo-big')+'<h1>'+esc(d.f||'Um amigo')+' te desafiou!</h1><p class="note">Tema: <b>'+g.title+'</b> · '+d.n+' perguntas · nível '+(d.l==='ini'?'iniciante':esc(d.l))+'. Quem acertar mais, ganha.</p></div>'+
   '<button class="btn prim" data-act="daccept">Aceitar desafio</button><button class="btn ghost" data-act="dclose" style="margin-top:10px">Agora não</button>','Desafio');
}
function duelAccept(){var d=D.pend;duelBegin(d.g,d.s,d.l,'amigo',{name:d.f||'Amigo',r:d.r})}
function duelToast(t){var e=$('#lesson .frmsg');if(e){e.hidden=false;e.textContent=t}}

var DUEL_PEND=null;try{var dm=location.hash.match(/duelo=([A-Za-z0-9_-]+)/);if(dm)DUEL_PEND=b64d(dm[1])}catch(e){}
if(DUEL_PEND&&DUEL_PEND.g!=null)duelIntro(DUEL_PEND);else if(!S.picked&&!S.onb)showCursoPicker();else showWelcome();
try{var mh=location.hash.match(/convite=([A-Z0-9]{4,8})/);if(mh&&S.onb)showAmigos(mh[1])}catch(e){}
</script>
