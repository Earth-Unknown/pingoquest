<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Pingo Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: trilha vertical em zigue-zague, estilo app de lições; mascote Pingo (um roteador) */
:root{
  /* Paleta oficial do guia visual do Pingo Quest. Padrão: modo claro (branco). Modo escuro: roxo neon. */
  --roxo:#7b3ff2; --roxo-fundo:#2a0a66; --lilas:#c88bff; --ciano-neon:#18ddfb; --rosa:#ff4fae; --amarelo:#ffd83d; --laranja:#ff9a1f; --verde:#7dff2b; --branco:#fff;
  --bg:#ffffff; --surface:#ffffff; --ink:#1f1642; --muted:#6c6492;
  --line:#e6e1f6; --line-deep:#d4cdee;
  --primary:#7b3ff2; --primary-deep:#5a22c4; --on-primary:#ffffff;
  --ok:#3fc83f; --ok-deep:#2a9a2a; --ok-bg:#e4f9d8; --ok-ink:#27730f;
  --bad:#ff4d6d; --bad-deep:#cf2f4e; --bad-bg:#ffe4ea; --bad-ink:#b0213f;
  --gold:#ffd83d; --gold-deep:#d9a400; --cyan:#0fa8d4;
  --locked:#ebe8f6; --locked-deep:#d6d0ea;
  --face:#1b1240;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#150638; --surface:#211052; --ink:#ffffff; --muted:#b9a9e4;
  --line:#3d2a8f; --line-deep:#31207a;
  --ok:#7dff2b; --ok-deep:#4fb80e; --ok-bg:#24511c; --ok-ink:#c4ff9a;
  --bad:#ff5a7a; --bad-deep:#cf3050; --bad-bg:#561344; --bad-ink:#ffc0d0;
  --cyan:#18ddfb;
  --locked:#41208f; --locked-deep:#2e1470;
  --face:#12052e;
  color-scheme:dark;
}

*{box-sizing:border-box}
:root[data-theme="dark"] body{background-image:linear-gradient(180deg,#1b0944,#12053a);background-attachment:fixed}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
svg{display:block}

/* barra de status */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding-inline:max(16px,env(safe-area-inset-left,0px));
  border-bottom:2px solid var(--line)}
#top .wrap{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;gap:8px}
.stat{display:flex;align-items:center;gap:7px;font-weight:900;font-size:18px}
.stat svg{width:24px;height:24px}
.s-streak{color:#ff8a1f;background:none;border:0;padding:4px 6px;margin:-4px -6px;border-radius:12px;font:inherit;cursor:pointer}.s-gems{color:var(--cyan)}.s-heart{color:var(--bad)}

/* botões 3D */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:900;font-size:16px;
  letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--roxo-fundo);box-shadow:0 5px 0 var(--gold-deep);
  transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--gold-deep)}
.btn:disabled{background:var(--locked);color:var(--muted);box-shadow:0 5px 0 var(--locked-deep);cursor:not-allowed}
.btn.blue{background:var(--cyan);box-shadow:0 5px 0 #0e87b3;color:#04202c}
.btn.blue:active:not(:disabled){box-shadow:0 0 0 #0e87b3}
.btn.ghost{background:var(--surface);color:var(--cyan);border:2px solid var(--line-deep);box-shadow:0 4px 0 var(--line-deep);padding:13px 18px}
.btn.ghost:active{box-shadow:0 0 0 var(--line-deep);transform:translateY(4px)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 var(--bad-deep)}
.btn.bad:active{box-shadow:0 0 0 var(--bad-deep)}
.btn.prim{background:var(--primary);color:var(--on-primary);box-shadow:0 5px 0 var(--primary-deep)}
.btn.prim:active{box-shadow:0 0 0 var(--primary-deep)}

/* trilha */
.unit{margin-top:18px}
.nextsec{margin:34px -16px 0;padding:26px 20px 30px;text-align:center;background:var(--locked);border-top:2px solid var(--line-deep);color:var(--muted)}
.nschip{display:inline-block;background:var(--surface);color:var(--muted);font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:12px;border:2px solid var(--line-deep)}
.nextsec h2{margin:14px 0 6px;font-size:28px;font-weight:900;color:var(--ink);opacity:.55;display:flex;align-items:center;justify-content:center;gap:8px}
.nextsec h2 svg{width:26px;height:26px}
.nextsec .nspingo{opacity:.5;filter:grayscale(.6);display:flex;justify-content:center}.nextsec .nspingo svg{width:88px;height:88px}
.nextsec p{margin:6px auto 16px;font-weight:700;max-width:30ch;text-wrap:balance}
.nextsec .btn:disabled{opacity:.7}
.uhead{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:18px;padding:14px 16px;color:#fff;
  background:var(--uh);box-shadow:0 5px 0 var(--ud)}
.uhead .tag{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.uhead h2{margin:2px 0 0;font-size:21px;line-height:1.15;font-weight:900;text-wrap:balance}
.tipbtn{flex:none;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;border-radius:12px;
  padding:7px 13px;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.u0{--uh:#0fa8d4;--ud:#0a7a9c}.u1{--uh:#f27d0c;--ud:#b85a00}.u2{--uh:#f0409f;--ud:#b32477}.u3{--uh:#22a83a;--ud:#167a28}.u4{--uh:#7b3ff2;--ud:#5420bd}
.uhead{background:linear-gradient(135deg,var(--uh),color-mix(in srgb,var(--uh) 70%,#fff 30%))}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 8px}
.nw{position:relative;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.node svg{width:34px;height:34px}
.node.done{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep);color:#fff}
.node.cur{background:var(--uh,var(--primary));box-shadow:0 6px 0 var(--ud,var(--primary-deep)),0 0 22px color-mix(in srgb,var(--uh,#7b3ff2) 70%,transparent);color:#fff}
.node.lock{background:color-mix(in srgb,var(--uh,#7b3ff2) 18%,var(--locked));box-shadow:0 6px 0 var(--locked-deep);color:var(--muted);cursor:not-allowed}
.node:active:not(.lock){transform:translateY(6px);box-shadow:0 0 0 transparent}
.nlabel{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.bubble{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line-deep);
  color:var(--cyan);font-weight:900;font-size:13px;letter-spacing:.07em;padding:6px 12px;border-radius:12px;white-space:nowrap;
  animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);
  border-right:2px solid var(--line-deep);border-bottom:2px solid var(--line-deep);transform:translateX(-50%) rotate(45deg)}
.pingo{position:absolute;top:2px;width:64px}
.pingo.l{right:calc(100% + 14px)}.pingo.r{left:calc(100% + 14px)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}

/* navegação */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:transparent;border:0;pointer-events:none;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  --nc1:#cdbbf5;--nc2:#c6b2f3;--nc2s:#c6b2f3;--nc3:#ece3fc;--nc4:#d9c9f6;--ns:#8f72dc}
#nav .wrap{pointer-events:auto;display:flex;gap:2px;justify-content:center;max-width:560px;margin:0 auto;padding:6px;border-radius:30px;
  background:linear-gradient(180deg,#ffffff,#f1eaff);border:2px solid #ddd0fb;box-shadow:0 10px 24px rgba(123,63,242,.22),0 3px 0 #d3c4f7}
.nbtn{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;border:3px solid transparent;
  border-radius:22px;padding:7px 0 6px;font-weight:900;font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:#6a5aa6;min-height:62px}
.nbtn svg{width:34px;height:34px;transition:transform .15s}
.nbtn[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
:root[data-theme="dark"] #nav{--nc1:#fbf1e6;--nc2:#f1e8ff;--nc2s:#f1e8ff;--nc3:#fff8ff;--nc4:#efe4ff;--ns:none}
:root[data-theme="dark"] #nav .wrap{border:0;background:linear-gradient(180deg,#5a24c8,#3d1590);box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
:root[data-theme="dark"] .nbtn{color:#fff}
.nbtn[data-t=path]{--ic:#18ddfb}.nbtn[data-t=missions]{--ic:#ff4fae}.nbtn[data-t=review]{--ic:#7dff2b}.nbtn[data-t=conq]{--ic:#ffd83d}.nbtn[data-t=profile]{--ic:#c88bff}
.nbtn[aria-current="page"]{border-color:#d2bff8;background:#ece3ff;color:#5a2ec4;box-shadow:none}
:root[data-theme="dark"] .nbtn[aria-current="page"]{border-color:rgba(200,139,255,.55);background:rgba(200,139,255,.20);color:#fff;box-shadow:none}

/* perfil */
.ph{display:flex;align-items:center;gap:16px;padding:22px 0 8px}
.ph .pingo-big{width:104px;flex:none}
.ph h1{margin:0;font-size:28px;font-weight:900}
.ph p{margin:4px 0 0;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.tile{--tc:var(--cyan);background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 30%,var(--surface)),var(--surface) 75%);border:2px solid color-mix(in srgb,var(--tc) 70%,transparent);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.tile svg{width:30px;height:30px;flex:none}
.grid .tile:nth-child(1){--tc:#ffd83d}.grid .tile:nth-child(2){--tc:#ff9a1f}.grid .tile:nth-child(3){--tc:#18ddfb}.grid .tile:nth-child(4){--tc:#ff4fae}.grid .tile:nth-child(5){--tc:#7dff2b}.grid .tile:nth-child(6){--tc:#c88bff}
.tile b{display:block;font-size:24px;line-height:1.1;font-weight:900}
.tile span{font-size:13px;color:var(--muted);font-weight:700}
.sect{font-size:20px;font-weight:900;margin:22px 0 10px}
.skcard{position:relative;width:100%;height:78px;border-radius:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18);overflow:hidden}
.skcard svg{height:56px;width:56px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.skcard.off{filter:grayscale(.85) brightness(.9);opacity:.8}
.skst{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;font-weight:900;font-size:15px;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.skgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.sktile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.sktile.off .skico{opacity:.55;filter:saturate(.7)}.sktile.off{border-style:dashed}
.skico{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.skico svg{width:42px;height:42px}
.sktile b{font-size:14px;font-weight:900;line-height:1.2}.sktile small{font-size:12px;font-weight:800;color:var(--muted)}
.cqgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.cqtile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.cqico{width:52px;height:52px;border-radius:15px;background:#b9c0cc;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.cqtile:not(.on) .cqico{opacity:.55;filter:saturate(.7)}.cqtile:not(.on){border-style:dashed}.cqtile.on{box-shadow:0 0 16px rgba(255,216,61,.35);border-color:var(--amarelo)}
.cqico svg{width:34px;height:34px}
.cqtile b{font-size:12.5px;font-weight:900;line-height:1.15}.cqtile small{font-size:11px;font-weight:700;color:var(--muted);line-height:1.2}
.prog{background:var(--surface);border:2px solid var(--line-deep);border-radius:16px;padding:14px;margin-bottom:10px}
.prog .row{display:flex;justify-content:space-between;gap:10px;font-weight:800;margin-bottom:8px}
.bar{height:14px;border-radius:99px;background:var(--locked);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--verde),var(--ciano-neon));min-width:0;transition:width .4s}
.note{color:var(--muted);font-weight:700;font-size:14px}

/* lição */
#lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.lw{width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.lhead{display:flex;align-items:center;gap:14px;padding:14px 0}
.xbtn{border:0;background:transparent;color:var(--muted);padding:4px;border-radius:10px}
.xbtn svg{width:28px;height:28px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--locked);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.lbody{flex:1;overflow:auto;padding:10px 0 18px;min-height:0}
.eyebrow{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.q{font-size:25px;font-weight:900;line-height:1.2;margin:8px 0 20px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line-deep);border-radius:16px;padding:15px 16px;font-weight:700;font-size:17px;
  box-shadow:0 4px 0 var(--line-deep);transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--line-deep)}
.opt.sel{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,var(--surface));box-shadow:0 4px 0 var(--cyan)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default}
.vf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vf .opt{text-align:center;padding:22px 10px;font-size:20px;font-weight:900}
.vf svg{width:44px;height:44px;margin:0 auto 6px}
.zone{min-height:92px;border:2px solid var(--line-deep);background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:18px}
.zone .ph0{color:var(--muted);font-family:var(--mono);font-weight:600;padding:8px 4px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:var(--surface);border:2px solid var(--line-deep);border-radius:12px;padding:9px 13px;font-family:var(--mono);font-weight:700;font-size:15px;
  box-shadow:0 3px 0 var(--line-deep);color:var(--ink)}
.chip:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.chip.used{visibility:hidden}
.chip.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 3px 0 var(--ok)}
.chip.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad)}
.lfoot{padding:10px 0 16px}
.fb{border-radius:18px;padding:14px 16px;margin-bottom:14px}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink)}.fb.bad{background:var(--bad-bg);color:var(--bad-ink)}
.fb h3{margin:0 0 4px;font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}
.fb h3 svg{width:26px;height:26px}
.fb p{margin:4px 0 0;font-weight:700;font-size:15px}
.fb .ans{font-family:var(--mono);font-weight:700}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:10px 0}
.center h1{margin:6px 0 0;font-size:34px;font-weight:900}
.center p{margin:0;color:var(--muted);font-weight:700;max-width:34ch;text-wrap:balance}
.center .pingo-big{width:170px}
.res2{display:flex;gap:10px;margin:18px 0 6px;width:100%;justify-content:center}
.rt{flex:1;max-width:120px;border-radius:18px;background:var(--rc);padding:4px;opacity:0;transform:scale(.3);animation:rtpop .8s cubic-bezier(.2,1.8,.4,1) forwards}
.rt small{display:block;padding:5px 2px 6px;font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.rt span{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border-radius:14px;padding:14px 4px}
.rt span svg{width:22px;height:22px;flex:none;color:var(--rc)}.rt span b{font-size:22px;font-weight:900;color:var(--rc)}
@keyframes rtpop{0%{opacity:0;transform:translateY(170px) scale(.35)}55%{opacity:1;transform:translateY(-12px) scale(1.08)}78%{transform:translateY(3px) scale(.97)}100%{opacity:1;transform:none}}
.rt b.bump{animation:numbump .4s cubic-bezier(.3,1.8,.5,1)}
.cpills{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;justify-content:center;gap:10px;z-index:60;pointer-events:none}
.cp{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--surface);border:2px solid var(--line);font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--line-deep);animation:cpin .45s cubic-bezier(.2,1.6,.4,1) both}
.cp svg{width:20px;height:20px;flex:none}.cp small{font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cp.e{color:#d99a00;border-color:#ffb800}.cp.g{color:#ff4fae;border-color:#ff4fae}
.cp.bump{animation:cpbump .25s ease-out}
@keyframes cpin{from{transform:translateY(-80px);opacity:0}to{transform:none;opacity:1}}
@keyframes cpbump{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.cpart{position:fixed;width:24px;height:24px;margin:-12px 0 0 -12px;z-index:70;pointer-events:none}.cpart svg{width:100%;height:100%}
@keyframes numbump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.rt{animation-duration:.01s}}
.res{display:flex;gap:12px;margin:14px 0 6px;width:100%}
.res div{flex:1;border:2px solid var(--line-deep);border-radius:16px;overflow:hidden;background:var(--surface)}
.res small{display:block;padding:5px;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.res b{display:block;padding:12px 6px;font-size:22px;font-weight:900}
.stack{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:14px}

/* dicas */
#modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,32,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-height:80%;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:23px;font-weight:900}
.sheet ul{margin:0 0 18px;padding-left:20px;font-weight:700}
.sheet li{margin-bottom:8px}
.sheet code{font-family:var(--mono);font-size:.92em;background:var(--locked);padding:1px 6px;border-radius:6px}

/* mascote */
.avbox{display:flex;justify-content:center;padding:6px 0}.avbig{width:170px}
.avrow{margin:10px 0}.avrow>b{display:block;font-size:14px;margin-bottom:6px;color:var(--muted)}
.avchips{display:flex;flex-wrap:wrap;gap:8px}
.avchip{font:inherit;font-weight:800;font-size:14px;padding:9px 12px;border-radius:12px;border:2px solid var(--line-deep);background:var(--surface);color:var(--text,inherit);cursor:pointer;display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px}
.avchip.on{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan) inset}
.avchip.lock{opacity:.55;cursor:default}.avchip small{font-weight:700;font-size:11px;color:var(--muted)}
.m-body{fill:var(--primary)}.m-low{fill:var(--primary-deep)}.m-face{fill:var(--face)}
.m-eye{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round}.m-pupil{fill:var(--cyan)}
.m-mouth{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round}.m-tip{fill:var(--gold)}.m-ant{stroke:var(--primary-deep);stroke-width:4;stroke-linecap:round}
.m-wifi{fill:none;stroke:rgba(255,255,255,.7);stroke-width:3;stroke-linecap:round}
.m-helm{fill:color-mix(in srgb,var(--primary) 42%,#fff)}
.m-oval{fill:var(--cyan);transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}

/* popup da fase */
.pop{position:relative;align-self:center;width:min(100%,320px);background:var(--uh);color:#fff;border-radius:20px;padding:16px 18px;
  box-shadow:0 6px 0 var(--ud);margin-top:8px;animation:popin .18s ease-out}
.pop::before{content:"";position:absolute;top:-9px;left:calc(50% + var(--ax,0px));width:18px;height:18px;background:var(--uh);
  transform:translateX(-50%) rotate(45deg);border-radius:4px}
.pop h3{position:relative;margin:0 0 4px;font-size:21px;font-weight:900}
.pop p{position:relative;margin:0 0 12px;font-weight:700}
.pop small{position:relative;display:block;margin:-6px 0 12px;font-weight:800;opacity:.9;font-size:13px}
.popbtn{position:relative;display:block;width:100%;border:0;background:#fff;color:var(--uh);border-radius:14px;padding:13px;font-weight:900;
  font-size:16px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.popbtn:active{transform:translateY(4px);box-shadow:none}
.pop.lockedp{--uh:var(--locked);--ud:var(--locked-deep);color:var(--ink)}
@keyframes popin{from{opacity:0;transform:translateY(-6px)}}
/* combinar pares */
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.opt.pi{text-align:center;font-size:16px;padding:12px 10px;min-height:68px;display:flex;align-items:center;justify-content:center;line-height:1.2;overflow-wrap:anywhere}
.opt.gone{opacity:.35;border-color:transparent;box-shadow:none;background:var(--locked)}
.prows{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.prow b{font-weight:900;overflow-wrap:anywhere}.prow span{color:var(--muted);font-weight:700;overflow-wrap:anywhere}

/* missões e revisão */
.card{--tc:var(--lilas);background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 18%,var(--surface)),var(--surface) 60%);border:2px solid color-mix(in srgb,var(--tc) 55%,transparent);border-top:5px solid var(--tc);border-radius:18px;padding:16px;margin-bottom:14px}
.main-cards .card:nth-of-type(4n+2),#main .card:nth-of-type(4n+2){--tc:#ff4fae}#main .card:nth-of-type(4n+3){--tc:#18ddfb}#main .card:nth-of-type(4n+4){--tc:#7dff2b}#main .card:nth-of-type(4n+1){--tc:#ffd83d}
.card h3{margin:0 0 12px;font-size:20px;font-weight:900}
.bar.gold{position:relative;height:24px}
.bar.gold i{background:var(--gold)}
.bar.gold span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(42,10,102,.9)}
.bar.sm{height:10px;margin:6px 0 3px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:2px solid var(--line)}
.card h3+.mrow{border-top:0;padding-top:0}
.mtxt{flex:1;min-width:0}.mtxt b{display:block;font-weight:800}.mtxt small{color:var(--muted);font-weight:800}
.mbtn{flex:none;border:0;border-radius:12px;background:var(--gold);color:#4a3300;padding:9px 12px;font-weight:900;font-size:13px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 var(--gold-deep)}
.mbtn:active{transform:translateY(4px);box-shadow:none}
.mpill{flex:none;display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line-deep);border-radius:12px;padding:7px 11px;font-weight:900;color:var(--cyan)}
.mpill svg,.gi svg{width:16px;height:16px}.gi{display:inline-flex}
.mpill.got{border-color:var(--ok);color:var(--ok)}.mpill.got svg{width:18px;height:18px}
.nbtn{position:relative}
.dot{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 5px;letter-spacing:0}
.prog .row span:first-child{min-width:0}
/* boas-vindas */
#welcome{position:fixed;inset:0;z-index:70;background:rgba(10,14,32,.62);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wcard{width:100%;max-width:380px;background:var(--surface);border-radius:28px;padding:22px 20px 20px;text-align:center;
  box-shadow:0 8px 0 var(--line-deep);animation:wpop .35s cubic-bezier(.2,1.3,.4,1)}
.wcard .pingo-w{width:128px;margin:0 auto 6px;animation:wbob 2.4s ease-in-out infinite}
.wcard h2{margin:0 0 8px;font-size:27px;font-weight:900;line-height:1.15;text-wrap:balance}
.wcard p{margin:0;color:var(--muted);font-weight:700;font-size:16px;text-wrap:balance}
.wpills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 20px}
.wpill{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px}
.wpill svg{width:18px;height:18px}
.revbtn{display:block;margin:16px auto 0;background:none;border:0;color:var(--cyan);font-weight:900;font-size:15px;padding:8px 12px;text-decoration:underline;text-underline-offset:3px}
.rvbox{margin-top:8px}
.wopts{display:grid;gap:10px;margin:16px 0 4px;text-align:left}
.wopts .opt{width:100%}
.wq{font-size:21px;font-weight:900;line-height:1.25;margin:6px 0 0;color:var(--fg);text-wrap:balance}
.wstep{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.wfb{margin:12px 0 0;padding:10px 12px;border-radius:14px;font-weight:800;font-size:15px;text-align:left}
.wfb.ok{background:var(--good-bg,#dff5e1);color:var(--good-ink,#1d6b2e)}
.wfb.no{background:var(--bad-bg);color:var(--bad-ink)}
.wcard .btn+.btn{margin-top:10px}
.wcard.nopop{animation:none}
.planrow{display:grid;gap:10px;margin:16px 0 18px;text-align:left}
.plan{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line-deep);background:var(--surface);color:var(--fg);border-radius:16px;padding:12px 14px;font-weight:800;box-shadow:0 3px 0 var(--line-deep);text-align:left}
.plan b{font-size:22px;font-weight:900;min-width:30px;text-align:center}
.plan small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.plan.on{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,var(--surface));box-shadow:0 3px 0 var(--cyan)}
.conn{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--cyan) 14%,var(--surface));border:2px solid var(--cyan);border-radius:16px;padding:8px 14px;margin-bottom:10px;animation:wpop .35s cubic-bezier(.2,1.3,.4,1)}
.conn b{display:block;font-weight:900;font-size:16px}.conn small{font-weight:800;color:var(--muted);font-size:13px}
.sig{display:flex;align-items:flex-end;gap:3px;height:26px;flex:none}.sig i{width:7px;border-radius:2px;background:var(--line-deep)}.sig i.on{background:var(--cyan)}
.gpill svg{width:18px;height:18px;flex:none}
.gpill{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--cyan) 14%,var(--surface));border:2px solid var(--cyan);border-radius:99px;padding:5px 14px;font-weight:900;font-size:14px;margin-top:4px}
.learned{width:100%;margin-top:10px;text-align:left}
.learned small{display:block;font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lchip svg{width:16px;height:16px}
.lscroll{display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.lscroll .center{justify-content:center}
.lchips{display:flex;flex-wrap:wrap;gap:8px}
.lchip{display:inline-flex;align-items:center;gap:6px;background:var(--ok-bg);color:var(--ok-ink);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px}
.wdays{display:flex;justify-content:space-between;gap:4px;margin:0 0 14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:900;color:var(--muted)}
.wd i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-deep);background:var(--surface);display:flex;align-items:center;justify-content:center}
.wd i svg{width:16px;height:16px}
.wd.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.wd.now{color:var(--fg)}.wd.now i{border-color:var(--cyan)}
.proof{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.proof small{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.proof div{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;line-height:1.3}
.proof b{font-weight:900}
.fb{position:relative}
.fbp{position:absolute;right:10px;top:8px;width:46px;pointer-events:auto}.fbp svg{width:46px;display:block;animation:fbpop .45s cubic-bezier(.2,1.5,.4,1)}
.fb h3,.fb p{padding-right:50px}
@keyframes fbpop{0%{transform:scale(.3) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
svg[aria-label^="Pingo"]{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.m-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.500%{transform:scaleY(.1)}}
.m-tip{animation:tipg 2.2s ease-in-out infinite}
@keyframes tipg{50%{opacity:.5}}
.pingo-big{animation:wbob 3.2s ease-in-out infinite}
svg.poke{animation:poke .6s cubic-bezier(.3,1.6,.5,1)!important;transform-origin:50% 90%}
svg.poke .m-ant{animation:antw .6s ease-out;transform-box:fill-box;transform-origin:50% 100%}
svg.poke .m-tip{fill:#fff;animation:none}
svg.poke .m-smile{animation:smoff .8s ease-in-out}
.m-wow{transform-box:fill-box;transform-origin:center;transform:scale(0)}
svg.poke .m-wow{animation:wow .8s ease-in-out}
@keyframes wow{0%,100%{transform:scale(0)}18%,72%{transform:scale(1)}}
@keyframes smoff{0%,100%{opacity:1}12%,80%{opacity:0}}
.m-limb{stroke:var(--primary-deep);stroke-width:6;stroke-linecap:round}
.m-hand{fill:var(--primary);stroke:var(--primary-deep);stroke-width:1.600}
.m-arm{transform-box:view-box}.m-arm.l{transform-origin:40px 90px}.m-arm.r{transform-origin:80px 90px}
svg.act-wave .m-arm.r{animation:awave 1.9s ease-in-out}
svg.act-clap .m-arm.l{animation:aclapl 1s ease-in-out}svg.act-clap .m-arm.r{animation:aclapr 1s ease-in-out}
svg.act-clap{animation:cbob 1s ease-in-out!important;transform-origin:50% 90%}
svg.act-jump{animation:jumpy 1.5s ease-in-out!important;transform-origin:50% 90%}
svg.act-jump .m-arm.l{animation:aupl 1.5s ease-in-out}svg.act-jump .m-arm.r{animation:aupr 1.5s ease-in-out}
svg.act-wave .m-smile{animation:none}
@keyframes awave{0%{transform:rotate(0)}12%{transform:rotate(-60deg)}24%{transform:rotate(-92deg)}36%{transform:rotate(-58deg)}48%{transform:rotate(-92deg)}60%{transform:rotate(-58deg)}72%{transform:rotate(-92deg)}88%{transform:rotate(-60deg)}100%{transform:rotate(0)}}
@keyframes aclapl{0%,100%{transform:none}15%,45%,75%{transform:translate(26px,-7px)}30%,60%{transform:translate(14px,-7px)}}
@keyframes aclapr{0%,100%{transform:none}15%,45%,75%{transform:translate(-26px,-7px)}30%,60%{transform:translate(-14px,-7px)}}
@keyframes cbob{0%,100%{transform:none}30%,60%,90%{transform:translateY(-3px)}15%,45%,75%{transform:translateY(0)}}
@keyframes jumpy{0%{transform:none}12%{transform:scale(1.08,.88)}30%{transform:translateY(-16px) scale(.95,1.07)}50%{transform:scale(1.07,.9)}68%{transform:translateY(-16px) scale(.95,1.07)}86%{transform:scale(1.05,.92)}100%{transform:none}}
@keyframes aupl{0%,100%{transform:none}14%,86%{transform:rotate(75deg)}}
@keyframes aupr{0%,100%{transform:none}14%,86%{transform:rotate(-75deg)}}
svg.poke .m-oval.r{animation:wink .7s ease-in-out}
@keyframes wink{0%,100%{transform:scaleY(1)}25%,70%{transform:scaleY(.1)}}
@keyframes poke{0%{transform:scale(1,1)}20%{transform:scale(1.14,.82)}45%{transform:translateY(-16px) scale(.94,1.1) rotate(-6deg)}70%{transform:translateY(0) scale(1.06,.94) rotate(4deg)}100%{transform:none}}
@keyframes antw{0%,100%{transform:rotate(0)}25%{transform:rotate(-24deg)}60%{transform:rotate(18deg)}}
.pbub{position:fixed;z-index:120;max-width:min(260px,calc(100vw - 24px));background:var(--surface);color:var(--fg);border:2px solid var(--primary);border-radius:16px;padding:9px 13px;font-weight:800;font-size:15px;line-height:1.25;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12);animation:pbin .25s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.pbub.out{opacity:0;transition:opacity .35s}
@keyframes pbin{0%{opacity:0;margin-top:8px}100%{opacity:1;margin-top:0}}
#fx{position:fixed;inset:0;z-index:110;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:var(--y);left:var(--x);width:9px;height:14px;border-radius:2px;background:var(--c);opacity:0;animation:cf 1.6s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}30%{opacity:1;transform:translate(calc(var(--dx)*.6),calc(var(--up)*-1)) rotate(calc(var(--r)*.4))}100%{opacity:0;transform:translate(var(--dx),var(--dn)) rotate(var(--r))}}
.sonar{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:3px solid var(--cyan);opacity:.9;animation:sonar .8s ease-out forwards}
@keyframes sonar{to{transform:scale(7);opacity:0}}
.slide{position:relative;height:56px;border-radius:28px;background:linear-gradient(90deg,#ff9a1f,#ffd83d);color:#2a0a66;display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:.03em;text-transform:uppercase;font-size:14px;user-select:none;overflow:hidden;box-shadow:0 4px 0 #c97a00;padding-left:52px;padding-right:14px;text-align:center}
.sl-knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:#fff;color:#2a0a66;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.sl-knob svg{width:24px;height:24px}
.sl-knob::before{content:"";position:absolute;inset:-8px}
.slide.done{background:var(--ok);box-shadow:0 4px 0 var(--ok)}.slide.done .sl-txt{opacity:0}.slide.done .sl-knob{color:var(--ok)}
.slide.nudge .sl-knob{animation:nudge .6s ease-in-out}
@keyframes nudge{30%{transform:translateX(34px)}60%{transform:translateX(0)}80%{transform:translateX(14px)}}
.slide:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.sheet.tall{max-height:90%}
.stk{display:flex;align-items:center;gap:14px}.stkp{width:72px;flex:none}.stkp svg{width:72px}
.stk .big{display:flex;align-items:center;gap:6px;font-size:44px;font-weight:900;line-height:1}.stk .big svg{width:40px;height:40px}
.stk small{font-weight:800;color:var(--muted);font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .ch{font-size:12px;color:var(--muted);font-weight:900}
.cd{display:flex;align-items:center;justify-content:center;height:34px;width:34px;margin:0 auto;border-radius:50%;font-weight:800;font-size:14px;color:var(--muted)}
.cd.on{background:#ff8a1f;color:#fff}.cd.now{outline:2px solid var(--cyan);outline-offset:1px}
.lupa{display:flex;align-items:center;gap:12px;margin-top:18px;border:2px dashed var(--line-deep);border-radius:16px;padding:12px 14px;opacity:.85}

.lupa b{display:block;font-weight:900}.lupa small{font-weight:700;color:var(--muted);font-size:13px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pl{border:2px solid var(--line-deep);background:var(--surface);color:var(--fg);border-radius:16px;padding:10px 6px;box-shadow:0 3px 0 var(--line-deep);font:inherit;display:flex;flex-direction:column;align-items:center}

.lupabtn{margin-top:14px;display:flex;gap:8px;align-items:center;justify-content:center}.lupabtn svg{width:20px;height:20px}
.chestcard{display:flex;align-items:center;gap:14px}
.cc-svg{flex:none;width:92px;display:block}.cc-svg .chest{width:92px;display:block}
.cc-t{flex:1;min-width:0}.cc-t h3{margin:0 0 4px}.cc-t .note{margin:0 0 10px}.cc-t .btn{padding:12px 14px}

 {title:"Ilha do Modelo OSI",names:["As 7 camadas","O que cada camada trata","Encapsulamento"],tips:[

  "Cada camada presta serviço à camada de cima.",
  "Ao enviar, cada camada adiciona seu cabeçalho (encapsulamento). Ao receber, o caminho inverte."],
  phases:[
  [{t:"learn",title:"As 7 camadas",text:"O modelo OSI divide a comunicação em 7 camadas, como andares de um prédio. De baixo para cima: 1 Física, 2 Enlace, 3 Rede, 4 Transporte, 5 Sessão, 6 Apresentação e 7 Aplicação. Cada camada presta serviço à de cima e só conversa com as vizinhas.",
    touch:[["Camadas 1 a 3","Física, Enlace e Rede: levam os dados pela rede."],["Camada 4","Transporte: cuida da conversa entre programas (TCP e UDP)."],["Camadas 5 a 7","Sessão, Apresentação e Aplicação: lidam com o programa do usuário."]]},
   {t:"mc",q:"Quantas camadas tem o modelo OSI?",o:["4","5","7","9"],a:2,e:"São 7: Física, Enlace, Rede, Transporte, Sessão, Apresentação e Aplicação."},
   {t:"vf",q:"A camada de Transporte é a camada 4 do modelo OSI.",a:true,e:"Isso mesmo. Ela cuida da comunicação entre processos (TCP e UDP)."},
   {t:"mc",q:"Qual camada cuida de endereços IP e roteamento?",o:["Física","Enlace","Rede","Aplicação"],a:2,e:"A camada de Rede (3) usa o IP para levar pacotes entre redes diferentes."},
   {t:"bl",q:"Monte as camadas do OSI, da 1 até a 7",blocks:["Física","Enlace","Rede","Transporte","Sessão","Apresentação","Aplicação"],a:["Física","Enlace","Rede","Transporte","Sessão","Apresentação","Aplicação"],sep:" › ",e:"Da base para o topo: Física, Enlace, Rede, Transporte, Sessão, Apresentação e Aplicação."}],
  [{t:"learn",title:"O que cada camada trata",text:"Cada camada lida com uma unidade de dados. A Física trabalha com bits, o Enlace com quadros (usa o MAC), a Rede com pacotes (usa o IP) e o Transporte com segmentos (TCP e UDP). Lá em cima, a Sessão controla o diálogo, a Apresentação cuida de formato, compressão e criptografia, e a Aplicação é onde vivem HTTP e e-mail. O TCP/IP clássico simplifica tudo em 4 camadas.",
    touch:[["Física","Bits, cabos e sinais."],["Enlace","Quadros e endereços MAC. É aqui que o switch trabalha."],["Rede","Pacotes e endereços IP. É aqui que o roteador trabalha."],["Transporte","Segmentos, TCP e UDP."],["Apresentação","Tradução de formatos, compressão e criptografia."]]},
   {t:"mp",q:"Combine cada camada com o que ela trata",pairs:[["Física","Bits, cabos e sinais"],["Enlace","Quadros e endereços MAC"],["Rede","Pacotes e endereços IP"],["Transporte","Segmentos, TCP e UDP"]],e:"Cada camada tem a sua unidade de dados: bits, quadros, pacotes e segmentos."},
   {t:"mc",q:"Um switch que decide para onde enviar usando endereços MAC trabalha em qual camada?",o:["Física","Enlace","Transporte","Aplicação"],a:1,e:"O MAC pertence à camada de Enlace (2), por isso o switch trabalha ali."},
   {t:"vf",q:"O modelo TCP/IP tem 7 camadas, igual ao OSI.",a:false,e:"Mito. O TCP/IP clássico tem 4 camadas: Acesso à Rede, Internet, Transporte e Aplicação."},
   {t:"mc",q:"Qual camada do OSI cuida de tradução de formatos, compressão e criptografia?",o:["Sessão","Apresentação","Enlace","Rede"],a:1,e:"A camada de Apresentação (6) prepara os dados para a aplicação."}],
  [{t:"learn",title:"Encapsulamento",text:"Ao enviar um dado, ele desce pelas camadas e cada uma coloca o seu envelope (cabeçalho) em volta. A Aplicação gera os dados, o Transporte cria o segmento, a Rede cria o pacote, o Enlace cria o quadro e a Física envia bits. No destino o caminho inverte, e cada camada abre o seu envelope.",
    touch:[["Descendo","Dados › Segmento › Pacote › Quadro › Bits."],["Cabeçalho","O envelope de cada camada, com as informações que ela precisa."],["No destino","O caminho inverte: cada camada abre o seu envelope e passa o conteúdo para cima."]]},
   {t:"mc",q:"O que é encapsulamento?",o:["Cada camada adiciona seu cabeçalho aos dados ao descer a pilha","Compactar um arquivo em .zip","Esconder o IP de origem","Trocar a senha do Wi-Fi"],a:0,e:"Ao descer as camadas, cada uma coloca o seu cabeçalho em volta dos dados, como envelopes dentro de envelopes."},
   {t:"mc",q:"Como se chama a unidade de dados (PDU) da camada de Enlace?",o:["Segmento","Pacote","Quadro (frame)","Bit"],a:2,e:"Na camada de Enlace a PDU é o quadro, também chamado de frame."},
   {t:"mc",q:"Como se chama a PDU da camada de Transporte no TCP?",o:["Quadro","Segmento","Pacote de rede","Mensagem de sessão"],a:1,e:"No TCP é o segmento. No UDP costuma-se dizer datagrama."},
   {t:"bl",q:"Monte a ordem do encapsulamento ao enviar um dado",blocks:["Dados","Segmento","Pacote","Quadro","Bits"],a:["Dados","Segmento","Pacote","Quadro","Bits"],sep:" › ",e:"A Aplicação gera os dados, o Transporte faz o segmento, a Rede faz o pacote, o Enlace faz o quadro e a Física envia bits."}]
 ]},
 {title:"Cidade dos Endereços IP",names:["O endereço IPv4","Máscara e hosts","IPv6, NAT e DHCP"],tips:[
  "IPv4 tem 32 bits, escritos em 4 números de 0 a 255 separados por ponto.",
  "Faixas privadas: <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code> e <code>192.168.0.0/16</code>.",
  "Hosts úteis em uma rede: <code>2^n − 2</code>, onde n é o número de bits de host."],
  phases:[
  [{t:"learn",title:"O endereço IPv4",text:"Um IPv4 é como um CEP dividido em 4 partes, por exemplo 192.168.1.10. Cada parte (octeto) vai de 0 a 255, porque tem 8 bits, e juntas somam 32 bits. Alguns blocos são privados e só valem dentro da rede local: 10.x.x.x, de 172.16 a 172.31 e 192.168.x.x. O resto é público.",
    touch:[["Octeto","Cada um dos 4 números: 8 bits, de 0 a 255."],["Privado","10.x.x.x, 172.16 a 172.31 e 192.168.x.x. Só valem dentro da rede local."],["Público","8.8.8.8 é público: qualquer um na internet consegue chegar nele."],["Loopback","127.0.0.1 é o próprio computador."]]},
   {t:"mc",q:"Quantos bits tem um endereço IPv4?",o:["16","32","48","64"],a:1,e:"32 bits, divididos em 4 octetos de 8 bits."},
   {t:"vf",q:"256.10.10.1 é um endereço IPv4 válido.",a:false,e:"Mito. Um octeto tem 8 bits, então o maior valor é 255."},
   {t:"mc",q:"Qual destes é um endereço IP privado?",o:["8.8.8.8","192.168.0.15","200.10.5.1","172.32.0.1"],a:1,e:"192.168.0.0/16 é privado. O bloco privado 172 só vai de 172.16 a 172.31, então 172.32.0.1 é público."},
   {t:"mc",q:"Qual endereço aponta para o próprio computador, sem sair para a rede?",o:["127.0.0.1","192.168.0.1","8.8.8.8","255.255.255.0"],a:0,e:"127.0.0.1 é o endereço de loopback: o computador conversando consigo mesmo."}],
  [{t:"learn",title:"Máscara e hosts",text:"A máscara de sub-rede diz quanto do IP é a rua (a rede) e quanto é a casa (o aparelho). 255.255.255.0 tem 24 bits ligados, por isso se escreve /24. Sobram 8 bits para os aparelhos: 2^8 = 256, menos 2 reservados (o endereço da rede e o de broadcast), dá 254 hosts úteis. O gateway padrão é a saída da rede para as outras redes.",
    touch:[["/24","255.255.255.0: 24 bits de rede e 8 de aparelho."],["Hosts úteis","2^n − 2, onde n é o número de bits de host."],["Gateway","Em geral o roteador. Recebe tudo que não é da rede local."],["/26","26 bits de rede: máscara 255.255.255.192 e 62 hosts úteis."]]},
   {t:"mc",q:"A máscara 255.255.255.0 equivale a qual prefixo?",o:["/8","/16","/24","/30"],a:2,e:"Três octetos cheios são 24 bits ligados, então /24."},
   {t:"mc",q:"Quantos hosts úteis cabem em uma rede /24?",o:["256","255","254","128"],a:2,e:"2^8 = 256, menos o endereço da rede e o de broadcast, sobram 254."},
   {t:"mc",q:"Seu computador quer abrir um site que está fora da rede local. Para onde ele envia o pedido primeiro?",o:["Para o gateway padrão","Para o computador do lado","Para o servidor de e-mail","Para a impressora"],a:0,e:"O que não é da rede local vai para o gateway padrão, que leva para as outras redes."},
   {t:"mc",q:"Qual é a máscara em decimal de uma rede /26?",o:["255.255.255.128","255.255.255.192","255.255.255.224","255.255.255.0"],a:1,e:"/26 são 24 + 2 bits ligados. O último octeto 11000000 vale 192."}],
  [{t:"learn",title:"IPv6, NAT e DHCP",text:"O IPv4 tem cerca de 4 bilhões de endereços, e eles acabaram. O IPv6 resolve com 128 bits. Dentro de casa você usa IP privado, e para sair o roteador faz o NAT, trocando o seu IP privado pelo IP público da casa. Quem entrega os IPs aos aparelhos sozinho é o DHCP, que oferece IP, máscara, gateway e DNS.",
    touch:[["IPv6","128 bits, escrito em hexadecimal. Endereços de sobra."],["NAT","O roteador troca o IP privado pelo público para sair para a internet."],["DHCP","Entrega IP, máscara, gateway e DNS automaticamente."]]},
   {t:"mc",q:"Quantos bits tem um endereço IPv6?",o:["32","64","128","256"],a:2,e:"IPv6 tem 128 bits, escritos em hexadecimal."},
   {t:"vf",q:"Um IP privado pode ser acessado diretamente de qualquer lugar da internet.",a:false,e:"Mito. IPs privados só valem na rede local. Para sair, o roteador usa o NAT."},
   {t:"mc",q:"Você conecta um celular novo ao Wi-Fi e ele recebe um IP sozinho, sem digitar nada. Qual protocolo fez isso?",o:["DNS","ARP","DHCP","ICMP"],a:2,e:"O DHCP entrega IP, máscara, gateway e DNS automaticamente."},
   {t:"mp",q:"Combine cada endereço com o que ele representa",pairs:[["127.0.0.1","O próprio computador (loopback)"],["192.168.1.1","IP privado, comum em roteadores"],["8.8.8.8","IP público (DNS do Google)"],["255.255.255.0","Máscara de sub-rede /24"]],e:"127.0.0.1 é o loopback, 192.168.x.x é privado, 8.8.8.8 é público e 255.255.255.0 é uma máscara."}]
 ]},
 {title:"Porto dos Protocolos",names:["Portas e web","TCP e UDP","Protocolos de apoio"],tips:[
  "TCP é confiável e ordenado. UDP é rápido e sem garantia de entrega.",
  "Portas comuns: HTTP 80, HTTPS 443, SSH 22, DNS 53.",
  "O handshake do TCP tem 3 passos: SYN, SYN-ACK, ACK."],
  phases:[
  [{t:"learn",title:"Portas e web",text:"O IP leva até o prédio, e a PORTA diz qual apartamento atender. Cada serviço tem uma porta padrão: HTTP usa a 80 e HTTPS usa a 443. O HTTPS é o HTTP com criptografia, por isso o cadeado no navegador. O SSH (porta 22) dá acesso remoto seguro, e o DNS (porta 53) traduz nomes em IPs.",
    touch:[["HTTP · 80","Carrega páginas web em texto aberto, sem criptografia."],["HTTPS · 443","O HTTP com criptografia. É o cadeado do navegador."],["SSH · 22","Acesso remoto criptografado, alternativa segura ao Telnet."],["DNS · 53","Traduz nomes de sites em endereços IP."]]},
   {t:"mc",q:"Qual é a porta padrão do HTTPS?",o:["21","80","443","8080"],a:2,e:"HTTPS usa a porta 443."},
   {t:"vf",q:"HTTP e HTTPS usam a mesma porta padrão.",a:false,e:"Mito. HTTP usa a 80 e HTTPS usa a 443."},
   {t:"mc",q:"Um site mostra um cadeado no navegador. Qual protocolo protege a conexão?",o:["HTTP","HTTPS","FTP","SMTP"],a:1,e:"O HTTPS acrescenta criptografia ao HTTP. O cadeado indica isso."},
   {t:"mp",q:"Combine cada serviço com a sua porta padrão",pairs:[["HTTP","80"],["HTTPS","443"],["SSH","22"],["DNS","53"]],e:"HTTP 80, HTTPS 443, SSH 22 e DNS 53."}],
  [{t:"learn",title:"TCP e UDP",text:"São duas formas de entregar dados. O TCP é como uma carta registrada: confirma o recebimento, reenvia o que se perdeu e mantém a ordem. Antes de começar, faz um aperto de mão de 3 passos: SYN, SYN-ACK e ACK. O UDP é como gritar do outro lado da rua: é mais rápido, mas sem garantia. Serve bem para videochamadas e jogos, onde perder um pedacinho é melhor que atrasar tudo.",
    touch:[["TCP","Confiável: confirma, reenvia e mantém a ordem. É mais pesado."],["UDP","Rápido e sem garantia. Ideal para vídeo ao vivo e jogos."],["Handshake","SYN, SYN-ACK, ACK: o aperto de mão que abre a conexão TCP."]]},
   {t:"mc",q:"Qual protocolo de transporte garante entrega e ordem dos dados?",o:["UDP","ICMP","TCP","ARP"],a:2,e:"O TCP usa confirmações e retransmissão para ser confiável."},
   {t:"mc",q:"Numa chamada de vídeo ao vivo, qual protocolo costuma ser preferido?",o:["TCP","UDP","FTP","SMTP"],a:1,e:"O UDP tem menos sobrecarga. Perder um quadro do vídeo é melhor que atrasar tudo."},
   {t:"vf",q:"Em uma chamada ao vivo, perder um pedacinho do vídeo é pior do que atrasar a chamada inteira.",a:false,e:"No ao vivo o atraso incomoda mais. Por isso o UDP, que não reenvia, costuma ser a escolha."},
   {t:"bl",q:"Monte o handshake de 3 vias do TCP",blocks:["SYN","SYN-ACK","ACK"],a:["SYN","SYN-ACK","ACK"],sep:" › ",e:"O cliente envia SYN, o servidor responde SYN-ACK e o cliente confirma com ACK."}],
  [{t:"learn",title:"Protocolos de apoio",text:"Alguns protocolos trabalham nos bastidores. O ARP pergunta na rede local \"quem tem este IP?\" e descobre o MAC. O ICMP leva mensagens de teste e de erro: é o que o comando ping usa. O NTP acerta o relógio dos aparelhos. E o DHCP entrega IPs automaticamente.",
    touch:[["ARP","Descobre o MAC a partir de um IP, na rede local."],["ICMP","Mensagens de teste e erro. O ping usa o ICMP."],["NTP","Mantém o relógio dos aparelhos certo."],["DHCP","Entrega IPs automaticamente."]]},
   {t:"mc",q:"Você usa o ping para testar se um servidor responde. Qual protocolo o ping usa?",o:["ICMP","HTTP","SSH","FTP"],a:0,e:"O ping envia mensagens ICMP Echo Request e espera um Echo Reply."},
   {t:"mc",q:"Seu computador sabe o IP do vizinho, mas precisa do MAC dele. Qual protocolo descobre?",o:["NTP","ARP","DHCP","DNS"],a:1,e:"O ARP pergunta na rede local quem tem aquele IP e recebe o MAC."},
   {t:"mc",q:"Qual protocolo mantém o relógio dos dispositivos da rede certo?",o:["NTP","FTP","SNMP","ARP"],a:0,e:"O NTP (Network Time Protocol) acerta a hora de todos os aparelhos."},
   {t:"mp",q:"Combine cada protocolo com o que ele faz",pairs:[["ARP","Descobre o MAC a partir do IP"],["ICMP","Mensagens de teste, como o ping"],["NTP","Acerta o relógio"],["DHCP","Entrega IPs automaticamente"]],e:"ARP acha o MAC, ICMP testa, NTP acerta a hora e DHCP entrega IPs."}]
 ]}
];

/* Pingo faz gestos (palmas, tchau, pulo) nas telas de comemoração */
var PACT={clap:1000,wave:1900,jump:1500};
function pingoAct(sv,name){
  if(!sv||!sv.isConnected)return;
  ['clap','wave','jump'].forEach(function(a){sv.classList.remove('act-'+a)});
  void sv.getBoundingClientRect();sv.classList.add('act-'+name);
  setTimeout(function(){sv.classList.remove('act-'+name)},PACT[name]+40);
}
function pingoShow(sv){
  var order=['clap','wave','jump'],i=Math.floor(Math.random()*3),n=0;
  (function step(){
    if(!sv.isConnected||n>=4)return;
    var a=order[i++%3];n++;pingoAct(sv,a);setTimeout(step,PACT[a]+700);
  })();
}
(function(){
  if(!window.MutationObserver)return;
  var mo=new MutationObserver(function(ms){
    ms.forEach(function(m){m.addedNodes.forEach(function(nd){
      if(nd.nodeType!==1)return;
      var sv=nd.matches&&nd.matches('svg[data-m="cheer"]')?nd:nd.querySelector&&nd.querySelector('svg[data-m="cheer"]');
      if(sv)setTimeout(function(){pingoShow(sv)},450);
    })});
  });
  ['lesson','welcome'].forEach(function(id){var el=document.getElementById(id);if(el)mo.observe(el,{childList:true,subtree:true})});
})();

];
var AV_DEF={cor:'azul',olhos:'ciano',antena:'padrao',cabeca:'',visor:'',costas:''};
function avKey(slot,id){return slot+':'+id}
function avHas(slot,it){
  if(it.free)return true;
  if(it.ev)return (S.inv.items||[]).indexOf(it.id)>=0;
  return (S.inv.items||[]).indexOf(avKey(slot,it.id))>=0;
}
/* concede itens cujas condições já foram cumpridas (idempotente, nunca duplica) */
function avSync(){
  var ch=false;S.inv=S.inv||{items:[],coll:{}};S.inv.items=S.inv.items||[];
  AV_SLOTS.forEach(function(sl){sl.itens.forEach(function(it){
    if(it.ok&&it.ok()&&S.inv.items.indexOf(avKey(sl.id,it.id))<0){S.inv.items.push(avKey(sl.id,it.id));ch=true}
  })});
  if(ch)save();
}
function avCfg(){
  var c=Object.assign({},AV_DEF,S.av||{});
  AV_SLOTS.forEach(function(sl){
    var it=sl.itens.filter(function(i){return i.id===c[sl.id]})[0];
    if(!it||!avHas(sl.id,it))c[sl.id]=AV_DEF[sl.id];
  });
  return c;
}
function avEquip(slot,id){
  var sl=AV_SLOTS.filter(function(x){return x.id===slot})[0];if(!sl)return;
  var it=sl.itens.filter(function(i){return i.id===id})[0];if(!it||!avHas(slot,it))return;
  S.av=Object.assign({},AV_DEF,S.av||{});
  if(S.av[slot]===id&&!sl.obrig)S.av[slot]='';else S.av[slot]=id;
  save();
}
function avatarHTML(){
  avSync();var cfg=avCfg();
  var h='<div class="sect">Meu robô</div><div class="avbox">'+pingo('happy','avbig',true)+'</div><p class="note" style="margin:0 0 6px;text-align:center">Itens são só visuais: não mudam as perguntas nem dão vantagem.</p>';
  AV_SLOTS.forEach(function(sl){
    h+='<div class="avrow"><b>'+sl.nome+'</b><div class="avchips">';
    sl.itens.forEach(function(it){
      var has=avHas(sl.id,it),on=cfg[sl.id]===it.id;
      if(has)h+='<button class="avchip'+(on?' on':'')+'" data-act="avequip" data-slot="'+sl.id+'" data-id="'+it.id+'" aria-pressed="'+on+'">'+it.nome+'</button>';
      else h+='<span class="avchip lock" aria-disabled="true">🔒 '+it.nome+'<small>'+it.req+'</small></span>';
    });
    h+='</div></div>';
  });
  var n=0,t=0;AV_SLOTS.forEach(function(sl){sl.itens.forEach(function(it){t++;if(avHas(sl.id,it))n++})});
  return h+'<p class="note" style="margin:8px 0 0">Inventário: '+n+' de '+t+' itens.</p>';
}
window.AVT={slots:AV_SLOTS,has:avHas,cfg:avCfg,equip:avEquip,sync:avSync};

function prep(q){

  if(q.t==='mp'){c.left=q.pairs.map(function(p,i){return{id:i,t:p[0]}});c.right=shuffle(q.pairs.map(function(p,i){return{id:i,t:p[1]}}))}
  if(q.t==='bl'){
    var bank,tries=0;
    do{bank=shuffle(q.blocks.map(function(t,i){return{id:i,t:t}}));tries++}
    while(tries<8&&bank.map(function(b){return b.t}).join('|')===q.a.join('|'));
    c.bank=bank;
  }
  if(q.t==='fill'){c.n=q.ans.length;c.bank=shuffle(q.ans.concat(q.extra||[]).map(function(t,i){return{id:i,t:t}}))}
  if(q.t==='cl'){c.ci=shuffle(q.items.map(function(x,i){return{id:i,t:x[0],c:x[1]}}))}

/* números sobem até o valor final, com tique suave a cada passo */
function countUp(b){
  if(!b)return;
  var to=parseInt(b.getAttribute('data-to'),10)||0,pre=b.getAttribute('data-pre')||'',suf=b.getAttribute('data-suf')||'';
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce||to<=0){b.textContent=pre+to+suf;return}
  var t0=null,last=-1,lastTick=0,dur=Math.min(1100,500+to*14);
  function fin(){b.textContent=pre+to+suf;b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
  function fr(ts){
    if(!b.isConnected)return;
    if(t0===null)t0=ts;
    var k=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-k,3),v=Math.round(to*e);
    if(v!==last){last=v;b.textContent=pre+v+suf;if(ts-lastTick>55&&v<to){lastTick=ts;sfx('tick')}}
    if(k<1)requestAnimationFrame(fr);else fin();
  }
  requestAnimationFrame(fr);
  setTimeout(function(){if(b.isConnected&&b.textContent!==pre+to+suf)fin()},dur+400);
}

  root.appendChild(bar);

  setTimeout(function(){

    jobs.forEach(function(j){
      var r=j.tile.getBoundingClientRect(),q=j.pill.getBoundingClientRect(),n=Math.min(9,Math.max(5,j.add)),sx=r.left+r.width/2,sy=r.top+r.height/2,tx=q.left+22,ty=q.top+q.height/2;
      j.tile.style.transition='transform .3s';j.tile.style.transform='scale(.9)';setTimeout(function(){j.tile.style.transform=''},300);
      total+=n;

        el.style.opacity='0';document.body.appendChild(el);
        var dx=tx-sx,dy=ty-sy,wob=(i%2?1:-1)*(20+i*5);
        var an=el.animate([{transform:'translate(0,0) scale(.5)',opacity:0},{transform:'translate('+(dx*.35+wob)+'px,'+(dy*.2-40)+'px) scale(1.25)',opacity:1,offset:.3},{transform:'translate('+dx+'px,'+dy+'px) scale(.55)',opacity:1}],{duration:750,delay:i*85,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});
        an.onfinish=function(){

     opts:shuffle(def.faults.map(function(f){return{id:f.id,t:f.cause}})),guided:!(rec&&rec.n>0)&&!o.replay};

   '<g class="ch-lid"><path d="M24 90a76 60 0 0 1 152 0z" fill="#6c4bf4"/><g clip-path="url(#cl'+k+')"><rect x="46" y="20" width="16" height="74" fill="#ffc800"/><rect x="138" y="20" width="16" height="74" fill="#ffc800"/><path d="M26 84a74 56 0 0 1 22-44" stroke="#a894ff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".65"/></g><rect x="20" y="84" width="160" height="14" rx="7" fill="#ffc800"/><circle cx="100" cy="94" r="9" fill="#ffd84a"/></g></svg>';
}
function chestReady(){var d=day(),ms=todays();return !d.chest&&ms.every(function(m){return m.p(d)>=m.g})}
var CZ=null;
function czHTML(){
  return '<div class="cz-gems" id="czg"><span class="gi">'+IC.gem+'</span><b id="czn">'+CZ.shown+'</b></div>'+
   '<h2 class="cz-h">Baú do dia</h2>'+
   '<button class="cz-chest idle" id="czchest" data-act="cztap" aria-label="Tocar no baú para abrir">'+chestSVG('z')+'</button>'+
   '<p class="cz-hint" id="czhint" aria-live="polite">Toque no baú!</p>'+
   '<div class="cz-pingo" id="czp">'+pingo('happy','pingo-cz')+'</div>'+
   '<p class="cz-say" id="czsay"></p>'+
   '<button class="btn cz-btn" data-act="czclose" id="czbtn" hidden>Continuar</button>';
}
function openChest(){
  if(!chestReady()||CZ)return;
  CZ={stage:0,shown:S.gems};
  var o=$('#chestfx');o.innerHTML=czHTML();o.hidden=false;document.body.classList.add('lock');sfx('ping');
  var b=$('#czchest');if(b&&b.focus){try{b.focus({preventScroll:true})}catch(e){}}
}
function czTap(){
  if(!CZ)return;var c=$('#czchest'),hint=$('#czhint');
  if(CZ.stage===0){
    CZ.stage=1;c.classList.remove('idle','shake','crack');void c.offsetWidth;c.classList.add('shake','crack');
    hint.textContent='Quase lá! Toque de novo.';sfx('boop');buzz(20);
  }else if(CZ.stage===1){CZ.stage=2;czOpen()}
}
function czOpen(){
  var d=day(),c=$('#czchest');
  d.chest=true;S.gems+=40;save();
  c.classList.remove('idle','shake','crack');c.classList.add('open');c.disabled=true;
  $('#czhint').textContent='';sfx('open');buzz([15,30,25,30,45]);
  var r=c.getBoundingClientRect();
  confetti(44,Math.round((r.left+r.width/2)/innerWidth*100),Math.round((r.top+r.height*.4)/innerHeight*100));
  var pg=$('#czp');pg.innerHTML=pingo('cheer','pingo-cz');var sv=pg.firstChild;if(sv)sv.classList.add('jump');
  $('#czsay').textContent='+40 chips! Você mandou bem hoje!';
  var tgt=$('#czg').getBoundingClientRect(),sx=r.left+r.width/2,sy=r.top+r.height*.38,ex=tgt.left+tgt.width/2,ey=tgt.top+tgt.height/2,N=8,landed=0;
  function land(){
    CZ.shown+=5;var n=$('#czn');if(n)n.textContent=CZ.shown;
    var g=$('#czg');if(g){g.classList.remove('czpop');void g.offsetWidth;g.classList.add('czpop')}
    sfx('coin');landed++;
    if(landed>=N){CZ.shown=S.gems;if(n)n.textContent=S.gems;setTimeout(function(){var bt=$('#czbtn');if(bt){bt.hidden=false;try{bt.focus({preventScroll:true})}catch(e){}}},250)}
  }
  for(var i=0;i<N;i++){
    (function(i){
      var el=document.createElement('span');el.className='cz-gem';el.innerHTML=IC.gem;$('#chestfx').appendChild(el);
      if(NOANIM||!el.animate){land();return}
      var ux=Math.round((i-3.5)*34+(Math.random()-.5)*20),uy=70+Math.round(Math.random()*70);
      var a=el.animate([
        {transform:'translate('+(sx-18)+'px,'+(sy-18)+'px) scale(.3)',opacity:0},
        {transform:'translate('+(sx-18+ux)+'px,'+(sy-18-uy)+'px) scale(1.2)',opacity:1,offset:.35},
        {transform:'translate('+(ex-18)+'px,'+(ey-18)+'px) scale(.6)',opacity:1}
      ],{duration:1150,delay:300+i*110,easing:'cubic-bezier(.35,.1,.3,1)',fill:'both'});
      a.onfinish=function(){if(el.parentNode)el.parentNode.removeChild(el);land()};
    })(i);
  }
}
function closeChest(){CZ=null;var o=$('#chestfx');o.hidden=true;o.innerHTML='';document.body.classList.remove('lock');render()}

document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='tyin'&&L){L.sel=e.target.value;var b=document.querySelector('#lesson [data-act=check]');if(b)b.disabled=!e.target.value.trim()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='tyin'&&L&&L.state==='ask'&&L.sel.trim()){e.preventDefault();e.target.blur();check()}
});
/* ---------- tela de sequência ---------- */
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function weekDays(){
  var d=new Date(),k=(d.getDay()+6)%7,out=[];d.setDate(d.getDate()-k);
  for(var i=0;i<7;i++){out.push(ds(d));d.setDate(d.getDate()+1)}return out;
}
function showStreak(){
  var st=streakNow(),plan=S.plan||5,wd=weekDays(),L7=['S','T','Q','Q','S','S','D'],h2=S.hist||{},td=today(),cnt=0,wk7='';
  wd.forEach(function(x,i){var on=!!h2[x];if(on)cnt++;wk7+='<span class="wd'+(on?' on':'')+(x===td?' now':'')+'"><i>'+(on?IC.check:'')+'</i>'+L7[i]+'</span>'});
  var now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),cal='';
  ['S','T','Q','Q','S','S','D'].forEach(function(x){cal+='<b class="ch">'+x+'</b>'});
  for(var i=0;i<off;i++)cal+='<span></span>';
  for(var d=1;d<=nd;d++){var key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');cal+='<span class="cd'+(h2[key]?' on':'')+(key===td?' now':'')+'">'+d+'</span>'}
  var gp=Math.min(cnt,plan),g=maxGap();
  var lupa=S.lupa
    ? '<div class="lupa on"><span class="li">'+IC.search+'</span><div><b>Lupa do Pingo desbloqueada</b><small>Nos casos, ela aponta qual aparelho verificar primeiro.</small></div></div>'
    : '<div class="lupa"><span class="li">'+IC.search+'</span><div><b>Lupa do Pingo</b><small>Chegue a 7 dias seguidos para desbloquear. Faltam '+Math.max(0,7-st)+'.</small></div></div>';
  var h='<div class="sheet tall" role="dialog" aria-label="Minha sequência">'+
   '<div class="stk"><span class="stkp">'+pingo(st>0?'cheer':'happy','pingo-s')+'</span><div><div class="big"><span style="color:#ff8a1f;display:contents">'+IC.flame+'</span>'+st+'</div><small>'+(st===1?'dia seguido':'dias seguidos')+(S.best>st?' · recorde '+S.best:'')+'</small></div></div>'+
   '<div class="wdays" style="margin-top:14px">'+wk7+'</div>'+
   '<div class="prog"><div class="row"><span>Meta da semana</span><span>'+gp+' de '+plan+' dias</span></div><div class="bar gold"><i style="width:'+(gp/plan*100)+'%"></i></div></div>'+
   '<p class="note" style="margin:10px 0 0">'+(g===0?'No plano de 7 dias, todo dia conta.':'Seu plano permite até '+g+(g===1?' dia':' dias')+' de folga seguido'+(g===1?'':'s')+' sem perder a sequência.')+'</p>'+
   '<div class="sect" style="margin-top:18px">'+MESES[m]+' de '+y+'</div><div class="cal">'+cal+'</div>'+
   lupa+
   '<div class="sect" style="margin-top:18px">Meu plano</div><div class="plans">'+[3,5,7].map(function(n){return '<button class="pl'+(plan===n?' on':'')+'" data-act="setplan" data-n="'+n+'"><b>'+n+'</b><small>dias por semana</small></button>'}).join('')+'</div>'+
   '<button class="btn prim" data-act="mclose" style="margin-top:18px">Fechar</button></div>';
  $('#modal').innerHTML=h;$('#modal').hidden=false;sfx('ping');
}

showWelcome();
