  return '<svg viewBox="0 0 200 170" class="chest" aria-hidden="true"><defs><radialGradient id="cg'+k+'"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><clipPath id="cl'+k+'"><path d="M24 90a76 60 0 0 1 152 0z"/></clipPath></defs>'+
   '<ellipse cx="100" cy="160" rx="72" ry="8" fill="rgba(0,0,0,.22)"/>'+
   '<circle class="ch-glow" cx="100" cy="86" r="88" fill="url(#cg'+k+')"/>'+
   '<g class="ch-base"><rect x="28" y="86" width="144" height="70" rx="14" fill="#4a2fc9"/><rect x="28" y="86" width="144" height="16" fill="#3a22a3"/>'+
   '<rect x="46" y="86" width="16" height="70" fill="#ffc800"/><rect x="138" y="86" width="16" height="70" fill="#ffc800"/>'+
   '<rect x="82" y="104" width="36" height="34" rx="9" fill="#ffc800"/><path d="M90 118q10-9 20 0M95 124q5-4 10 0" stroke="#4a2fc9" stroke-width="3.500" fill="none" stroke-linecap="round"/><circle cx="100" cy="131" r="2.800" fill="#4a2fc9"/></g>'+
   '<rect class="ch-in" x="34" y="88" width="132" height="14" rx="6" fill="#1cb0f6"/>'+
   '<g class="ch-lid"><path d="M24 90a76 60 0 0 1 152 0z" fill="#6c4bf4"/><g clip-path="url(#cl'+k+')"><rect x="46" y="20" width="16" height="74" fill="#ffc800"/><rect x="138" y="20" width="16" height="74" fill="#ffc800"/><path d="M26 84a74 56 0 0 1 22-44" stroke="#a894ff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".65"/></g><rect x="20" y="84" width="160" height="14" rx="7" fill="#ffc800"/><circle cx="100" cy="94" r="9" fill="#ffd84a"/></g></svg>';
}
function chestReady(){var d=day(),ms=todays();return !d.chest&&ms.every(function(m){return m.p(d)>=m.g})}
var CZ=null;
function czHTML(){
  return '<div class="cz-gems" id="czg"><span class="gi">'+IC.gem+'</span><b id="czn">'+CZ.shown+'</b></div>'+
   '<h2 class="cz-h">Baú do dia</h2>'+
   '<button class="cz-chest idle" id="czchest" data-act="cztap" aria-label="Tocar no baú para abrir">'+chestSVG('z')+'</button>'+
   '<p class="cz-hint" id="czhint" aria-live="polite">Toque no baú!</p>'+
   '<div class="cz-pingo" id="czp">'+pingo('happy','pingo-cz')+'</div>'+
   '<p class="cz-say" id="czsay"></p>'+
   '<button class="btn cz-btn" data-act="czclose" id="czbtn" hidden>Continuar</button>';
}
function openChest(){
  if(!chestReady()||CZ)return;
  CZ={stage:0,shown:S.gems};
  var o=$('#chestfx');o.innerHTML=czHTML();o.hidden=false;document.body.classList.add('lock');sfx('ping');
  var b=$('#czchest');if(b&&b.focus){try{b.focus({preventScroll:true})}catch(e){}}
}
function czTap(){
  if(!CZ)return;var c=$('#czchest'),hint=$('#czhint');
  if(CZ.stage===0){
    CZ.stage=1;c.classList.remove('idle','shake','crack');void c.offsetWidth;c.classList.add('shake','crack');
    hint.textContent='Quase lá! Toque de novo.';sfx('boop');buzz(20);
  }else if(CZ.stage===1){CZ.stage=2;czOpen()}
}
function czOpen(){
  var d=day(),c=$('#czchest');
  d.chest=true;S.gems+=40;save();
  c.classList.remove('idle','shake','crack');c.classList.add('open');c.disabled=true;
  $('#czhint').textContent='';sfx('open');buzz([15,30,25,30,45]);
  var r=c.getBoundingClientRect();
  confetti(44,Math.round((r.left+r.width/2)/innerWidth*100),Math.round((r.top+r.height*.4)/innerHeight*100));
  var pg=$('#czp');pg.innerHTML=pingo('cheer','pingo-cz');var sv=pg.firstChild;if(sv)sv.classList.add('jump');
  $('#czsay').textContent='+40 cristais! Você mandou bem hoje!';
  var tgt=$('#czg').getBoundingClientRect(),sx=r.left+r.width/2,sy=r.top+r.height*.38,ex=tgt.left+tgt.width/2,ey=tgt.top+tgt.height/2,N=8,landed=0;
  function land(){
    CZ.shown+=5;var n=$('#czn');if(n)n.textContent=CZ.shown;
    var g=$('#czg');if(g){g.classList.remove('czpop');void g.offsetWidth;g.classList.add('czpop')}
    sfx('coin');landed++;
    if(landed>=N){CZ.shown=S.gems;if(n)n.textContent=S.gems;setTimeout(function(){var bt=$('#czbtn');if(bt){bt.hidden=false;try{bt.focus({preventScroll:true})}catch(e){}}},250)}
  }
  for(var i=0;i<N;i++){
    (function(i){
      var el=document.createElement('span');el.className='cz-gem';el.innerHTML=IC.gem;$('#chestfx').appendChild(el);
      if(NOANIM||!el.animate){land();return}
      var ux=Math.round((i-3.5)*34+(Math.random()-.5)*20),uy=70+Math.round(Math.random()*70);
      var a=el.animate([
        {transform:'translate('+(sx-18)+'px,'+(sy-18)+'px) scale(.3)',opacity:0},
        {transform:'translate('+(sx-18+ux)+'px,'+(sy-18-uy)+'px) scale(1.2)',opacity:1,offset:.35},
        {transform:'translate('+(ex-18)+'px,'+(ey-18)+'px) scale(.6)',opacity:1}
      ],{duration:1150,delay:300+i*110,easing:'cubic-bezier(.35,.1,.3,1)',fill:'both'});
      a.onfinish=function(){if(el.parentNode)el.parentNode.removeChild(el);land()};
    })(i);
  }
}
function closeChest(){CZ=null;var o=$('#chestfx');o.hidden=true;o.innerHTML='';document.body.classList.remove('lock');render()}

document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='tyin'&&L){L.sel=e.target.value;var b=document.querySelector('#lesson [data-act=check]');if(b)b.disabled=!e.target.value.trim()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='tyin'&&L&&L.state==='ask'&&L.sel.trim()){e.preventDefault();e.target.blur();check()}
});
/* ---------- tela de sequência ---------- */
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function weekDays(){
  var d=new Date(),k=(d.getDay()+6)%7,out=[];d.setDate(d.getDate()-k);
  for(var i=0;i<7;i++){out.push(ds(d));d.setDate(d.getDate()+1)}return out;
}
function showStreak(){
  var st=streakNow(),plan=S.plan||5,wd=weekDays(),L7=['S','T','Q','Q','S','S','D'],h2=S.hist||{},td=today(),cnt=0,wk7='';
  wd.forEach(function(x,i){var on=!!h2[x];if(on)cnt++;wk7+='<span class="wd'+(on?' on':'')+(x===td?' now':'')+'"><i>'+(on?IC.check:'')+'</i>'+L7[i]+'</span>'});
  var now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),cal='';
  ['S','T','Q','Q','S','S','D'].forEach(function(x){cal+='<b class="ch">'+x+'</b>'});
  for(var i=0;i<off;i++)cal+='<span></span>';
  for(var d=1;d<=nd;d++){var key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');cal+='<span class="cd'+(h2[key]?' on':'')+(key===td?' now':'')+'">'+d+'</span>'}
  var gp=Math.min(cnt,plan),g=maxGap();
  var lupa=S.lupa
    ? '<div class="lupa on"><span class="li">'+IC.search+'</span><div><b>Lupa do Pingo desbloqueada</b><small>Nos casos, ela aponta qual aparelho verificar primeiro.</small></div></div>'
    : '<div class="lupa"><span class="li">'+IC.search+'</span><div><b>Lupa do Pingo</b><small>Chegue a 7 dias seguidos para desbloquear. Faltam '+Math.max(0,7-st)+'.</small></div></div>';
  var h='<div class="sheet tall" role="dialog" aria-label="Minha sequência">'+
   '<div class="stk"><span class="stkp">'+pingo(st>0?'cheer':'happy','pingo-s')+'</span><div><div class="big"><span style="color:#ff8a1f;display:contents">'+IC.flame+'</span>'+st+'</div><small>'+(st===1?'dia seguido':'dias seguidos')+(S.best>st?' · recorde '+S.best:'')+'</small></div></div>'+
   '<div class="wdays" style="margin-top:14px">'+wk7+'</div>'+
   '<div class="prog"><div class="row"><span>Meta da semana</span><span>'+gp+' de '+plan+' dias</span></div><div class="bar gold"><i style="width:'+(gp/plan*100)+'%"></i></div></div>'+
   '<p class="note" style="margin:10px 0 0">'+(g===0?'No plano de 7 dias, todo dia conta.':'Seu plano permite até '+g+(g===1?' dia':' dias')+' de folga seguido'+(g===1?'':'s')+' sem perder a sequência.')+'</p>'+
   '<div class="sect" style="margin-top:18px">'+MESES[m]+' de '+y+'</div><div class="cal">'+cal+'</div>'+
   lupa+
   '<div class="sect" style="margin-top:18px">Meu plano</div><div class="plans">'+[3,5,7].map(function(n){return '<button class="pl'+(plan===n?' on':'')+'" data-act="setplan" data-n="'+n+'"><b>'+n+'</b><small>dias por semana</small></button>'}).join('')+'</div>'+
   '<button class="btn prim" data-act="mclose" style="margin-top:18px">Fechar</button></div>';
  $('#modal').innerHTML=h;$('#modal').hidden=false;sfx('ping');
}

showWelcome();
</script>
